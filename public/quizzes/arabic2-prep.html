<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اللغة العربية (الجزء الثاني) — السادس الإعدادي</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#050d1a;--bg2:#0a2230;--tq:#14b8a6;--tq2:#0f766e;--gold:#d4af37;--gold2:#f3d97a}
*{font-family:'Cairo','Tajawal',sans-serif}
body{min-height:100vh;color:#e6f1f5;background:radial-gradient(1200px 600px at 80% -10%,#0f4a52 0%,transparent 60%),radial-gradient(900px 500px at 0% 100%,#0b2f4a 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2))}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:1.25rem;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.gold{background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(135deg,var(--tq),var(--tq2));color:#fff;font-weight:700;border-radius:.9rem;padding:.7rem 1.3rem;transition:.2s;border:1px solid rgba(255,255,255,.18)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,184,166,.35)}
.btn-gold{background:linear-gradient(135deg,#b8901f,var(--gold));color:#1a1405}
.btn-ghost{background:rgba(255,255,255,.08)}
.opt{width:100%;text-align:right;padding:.9rem 1.1rem;border-radius:.9rem;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);transition:.2s;display:flex;gap:.75rem;align-items:center}
.opt:not(:disabled):hover{border-color:var(--tq);background:rgba(20,184,166,.12)}
.opt.ok{background:rgba(34,197,94,.22);border-color:#22c55e}
.opt.bad{background:rgba(239,68,68,.22);border-color:#ef4444}
.k{width:2rem;height:2rem;border-radius:.6rem;background:rgba(212,175,55,.18);color:var(--gold2);display:grid;place-items:center;font-weight:800;flex:none}
.bar{height:.55rem;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--tq),var(--gold));transition:width .4s}
.fade{animation:f .35s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="p-4 md:p-8">
<script src="../catalog.js"></script><script src="../nav.js"></script>
<div id="app" class="max-w-3xl mx-auto"></div>
<script>
const DATA = [{"chapter": 1, "title": "الوحدة السادسة: أسلوب التعجب والمسرحية", "questions": [{"t": "mcq", "q": "ما الصيغتان القياسيتان للتعجب؟", "o": ["ما أفعلَه، وأفعِلْ به", "نِعم وبئس", "ليت ولعل", "كم الخبرية وكم الاستفهامية"], "e": "التعجب القياسي يتحقق بصيغتين: (ما أفعلَه) و(أفعِلْ به).", "p": 0}, {"t": "mcq", "q": "في «ما أجملَ الربيعَ!» تُعرب «ما»:", "o": ["مبتدأ مبنيّاً في محل رفع (تعجبية)", "فاعلاً مرفوعاً", "مفعولاً به منصوباً", "حرف نفي"], "e": "«ما» التعجبية تعرب مبتدأ مبنية على السكون في محل رفع، و«أجمل» فعل التعجب.", "p": 0}, {"t": "mcq", "q": "في «أكرِمْ بهم!» الباء هي:", "o": ["حرف جر زائد", "حرف جر أصلي", "حرف عطف", "حرف قسم"], "e": "الباء في «أفعِل به» حرف جر زائد، والمتعجَّب منه فاعل مرفوع محلاً.", "p": 0}, {"t": "mcq", "q": "أي فعل مما يأتي لا يُشتق منه فعل التعجب القياسي؟", "o": ["الفعل المنفي", "الفعل الثلاثي التام المتصرف", "الفعل المثبت", "الفعل المبني للمعلوم القابل للتفاوت"], "e": "يشترط أن يكون الفعل ثلاثياً تاماً متصرفاً مثبتاً مبنياً للمعلوم قابلاً للتفاوت؛ فلا يُشتق من المنفي.", "p": 0}, {"t": "tf", "q": "من صيغ التعجب السماعية قولنا «سبحان الله!».", "a": true, "e": "التعجب السماعي موروث عن العرب ومنه «سبحان» وهو مفعول مطلق.", "p": 0}, {"t": "mcq", "q": "المسرحية في مفهومها العام:", "o": ["قصة يجري فيها الحوار بين شخوصها الذين يمثلون أحداثها للمشاهدين على المسرح", "نص شعري غنائي قصير", "مقالة تعالج موضوعاً معيناً", "سرد لسيرة إنسان"], "e": "المسرحية قصة يجري فيها الحوار بين شخوصها، يمثلون أحداثها على المسرح.", "p": 0}, {"t": "mcq", "q": "ما الصفة الأساسية المميزة للمسرحية في كتابتها؟", "o": ["مقدرة المؤلف على الاختفاء فلا يراه المشاهد", "كثرة الوصف", "السرد بضمير المتكلم", "الاعتماد على الراوي"], "e": "المؤلف يتوارى ولا يرى المشاهد إلا شخوصاً مختلفة تتحدث بأصوات متباينة.", "p": 0}, {"t": "mcq", "q": "تنقسم المسرحية من حيث الصياغة إلى:", "o": ["شعرية ونثرية", "تاريخية وخيالية", "حزينة ومضحكة فقط", "قصيرة وطويلة"], "e": "المسرحية نوعان: المسرحية الشعرية والمسرحية النثرية.", "p": 0}, {"t": "mcq", "q": "إلى من نُسب هذا النوع الأدبي لاهتمامهم به وإعلاء شأنه؟", "o": ["الإغريق", "الرومان", "الفرس", "الهنود"], "e": "اهتمام الإغريق بهذا النوع الأدبي جعله يُنسب إليهم.", "p": 0}]}, {"chapter": 2, "title": "الوحدة السابعة: المدح والذم والقصة القصيرة", "questions": [{"t": "mcq", "q": "فعلا المدح هما:", "o": ["نِعم وحبّذا", "بئس ولا حبّذا", "كان وأخواتها", "ظنّ وأخواتها"], "e": "أفعال المدح: نعم وحبذا، وأفعال الذم: بئس ولا حبذا.", "p": 0}, {"t": "mcq", "q": "فعلا الذم هما:", "o": ["بئس ولا حبّذا", "نِعم وحبّذا", "عسى وكاد", "ليس وما دام"], "e": "للذم: بئس ولا حبذا.", "p": 0}, {"t": "mcq", "q": "في «نِعمَ الرجلُ محمدٌ» المخصوص بالمدح هو:", "o": ["محمد", "الرجل", "نعم", "لا شيء"], "e": "الفاعل هو «الرجل» والمخصوص بالمدح هو «محمد».", "p": 0}, {"t": "mcq", "q": "الفعل «ساء» يأتي بمعنى:", "o": ["بئس (للذم)", "نعم (للمدح)", "كان", "ظن"], "e": "«ساء» فعل ذم كـ«بئس»، ومنه: «ساء ما يعملون».", "p": 0}, {"t": "mcq", "q": "القصة بوجه عام:", "o": ["حكاية يروي بها الإنسان ما رأى أو سمع أو تصور", "مقالة تحليلية", "قصيدة غنائية", "خطبة منبرية"], "e": "القصة بوجه عام حكاية، والحكاية يرويها الإنسان للآخرين.", "p": 0}, {"t": "tf", "q": "القصة القصيرة تُعبّر عن مجموعة أحداث أو شخصية يرتبها الراوي في مدة زمنية قصيرة.", "a": true, "e": "من سمات القصة القصيرة ترتيب الأحداث في مدة زمنية قصيرة وبصورة مركزة.", "p": 0}]}, {"chapter": 3, "title": "الوحدة الثامنة: التمني والترجي والرواية", "questions": [{"t": "mcq", "q": "التمني هو:", "o": ["طلب شيء محبوب يبعد تحقيقه أو لا يمكن حصوله", "طلب أمر محبوب ممكن الحصول", "طلب بلين ورفق", "نداء للبعيد"], "e": "التمني: طلب أمر محبوب يُستبعد تحقيقه أو لا يمكن حصوله، وأداته الأصلية «ليت».", "p": 0}, {"t": "mcq", "q": "الترجي هو:", "o": ["طلب أمر محبوب ممكن أو متوقع الحصول", "طلب المستحيل", "طلب بحث وإزعاج", "استفهام عن الزمان"], "e": "الترجي: طلب أمر محبوب ممكن أو متوقع، وأداته «لعل».", "p": 0}, {"t": "mcq", "q": "«ليت» و«لعل» من:", "o": ["إنّ وأخواتها", "كان وأخواتها", "ظنّ وأخواتها", "كاد وأخواتها"], "e": "تنصب المبتدأ اسماً لها وترفع الخبر خبراً لها.", "p": 0}, {"t": "tf", "q": "قد يخرج الاستفهام إلى معنى التمني كما في «فهل إلى خروج من سبيل».", "a": true, "e": "من أغراض الاستفهام المجازي: التمني.", "p": 0}, {"t": "mcq", "q": "تختلف الرواية عن القصة القصيرة في:", "o": ["الطول ووفرة الشخصيات وكثرة الأحداث", "عدم وجود خيال", "كتابتها شعراً", "عدم وجود حوار"], "e": "الرواية طويلة تتعدد فيها الشخصيات وتتشعب الأحداث.", "p": 0}, {"t": "mcq", "q": "تختلف الرواية عن السيرة الذاتية بـ:", "o": ["وجود عنصر الخيال الواسع فيها", "خلوها من الأحداث", "قصرها", "خلوها من الشخصيات"], "e": "في الرواية خيال واسع بخلاف السيرة الذاتية.", "p": 0}, {"t": "mcq", "q": "الواقعية في النقد الأدبي نوعان:", "o": ["حقيقي وفني", "شعري ونثري", "قديم وحديث", "ذاتي وموضوعي"], "e": "الواقع نوعان: حقيقي وفني؛ الأول كالصورة الفوتوغرافية، والثاني معقول إبداعي.", "p": 0}]}, {"chapter": 4, "title": "الوحدة التاسعة: العرض والتحضيض والمقالة", "questions": [{"t": "mcq", "q": "العرض هو:", "o": ["طلب برفق ولين", "طلب بحث وإزعاج", "نداء", "نفي"], "e": "العرض طلب برفق وليّن، والتحضيض طلب بحث وشدة.", "p": 0}, {"t": "mcq", "q": "أدوات العرض:", "o": ["أَلا، أَمَا، لو", "هلّا، لولا، لوما", "ما، لا، لم", "إنّ، أنّ"], "e": "أدوات العرض: ألا وأما ولو.", "p": 0}, {"t": "mcq", "q": "إحدى أدوات التحضيض:", "o": ["هلّا", "أَلا", "أَمَا", "لو"], "e": "هلّا ولولا ولوما من أدوات التحضيض.", "p": 0}, {"t": "tf", "q": "أدوات العرض والتحضيض تختص بالدخول على الأفعال.", "a": true, "e": "لهما أدوات تختص بالدخول على الأفعال وتتضمن معنى (افعل).", "p": 0}, {"t": "mcq", "q": "المقالة:", "o": ["قطعة إنشائية نثرية تعالج موضوعاً معيناً من وجهة نظر الكاتب", "قصيدة طويلة", "مسرحية قصيرة", "حكاية شعبية"], "e": "المقالة إحدى أنواع فن النثر، تعالج موضوعاً من وجهة نظر كاتبها.", "p": 0}, {"t": "mcq", "q": "يُعد منشئ المقالة الحديثة الكاتب الفرنسي:", "o": ["مونتيني", "فولتير", "هوغو", "موليير"], "e": "مونتيني (1533–1592).", "p": 0}, {"t": "mcq", "q": "ارتبطت المقالة ارتباطاً وثيقاً بـ:", "o": ["الصحافة", "المسرح", "الغناء", "الرواية الطويلة"], "e": "ازدهرت المقالة بازدياد الصحف والمجلات.", "p": 0}]}, {"chapter": 5, "title": "الوحدة العاشرة: التحذير والإغراء والسيرة والرمزية", "questions": [{"t": "mcq", "q": "التحذير هو:", "o": ["تنبيه المخاطَب على أمر مكروه ليجتنبه", "حث المخاطب على أمر محبوب", "نداء", "تعجب"], "e": "التحذير: تنبيه المخاطب على أمر مكروه ليجتنبه ويبتعد عنه.", "p": 0}, {"t": "mcq", "q": "أركان التحذير الثلاثة:", "o": ["المحذِّر والمحذَّر والمحذَّر منه", "الفاعل والمفعول والحال", "المبتدأ والخبر والفضلة", "المنادى والنداء والأداة"], "e": "الأصل في التحذير اشتماله على المحذِّر والمحذَّر والمحذَّر منه.", "p": 0}, {"t": "mcq", "q": "أيّ العبارتين إغراء؟", "o": ["الأخلاقَ فإنها الطريق إلى الله", "إياكم من الظلم", "النار النار", "إياك والكذب"], "e": "الإغراء حث المخاطب على أمر محبوب ليفعله، كـ«الأخلاقَ».", "p": 0}, {"t": "mcq", "q": "في «النارَ!» محذراً: تقدير الفعل المحذوف:", "o": ["احذر النار", "اقرأ النار", "انظر إليها", "شاهد النار"], "e": "المحذَّر منه منصوب بفعل محذوف جوازاً تقديره (احذر).", "p": 0}, {"t": "mcq", "q": "تنقسم السيرة إلى:", "o": ["ذاتية وموضوعية", "شعرية ونثرية", "قديمة وحديثة", "قصيرة وطويلة"], "e": "السيرة ذاتية وموضوعية.", "p": 0}, {"t": "mcq", "q": "السيرة الذاتية يؤلفها:", "o": ["الكاتب عن حياته هو", "كاتب آخر عن غيره", "راوٍ مجهول", "مؤرخ فقط"], "e": "الذاتية يدوّن فيها الكاتب أحداث حياته المهمة.", "p": 0}, {"t": "mcq", "q": "ظهرت الرمزية في الأدب والفن في:", "o": ["فرنسا أواخر القرن التاسع عشر", "إنكلترا في القرن السادس عشر", "اليونان القديمة", "العراق في القرن العشرين"], "e": "ظهرت في فرنسا رد فعل على المذهبين الواقعي والطبيعي.", "p": 0}, {"t": "mcq", "q": "يعبّر الرمزيون عن الشعور الباطني بـ:", "o": ["الإيحاء والرمز والموسيقى والصور الشعرية", "التصوير الفوتوغرافي", "التسجيل الحرفي للواقع", "الخطابة المباشرة"], "e": "الرمزية تعتمد الإيحاء والرمز بدل التسجيل المباشر.", "p": 0}]}];
const $=s=>document.querySelector(s), app=$('#app');
const KEY='ar2-v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}};
const save=(id,v)=>{try{const d=load();if(!d[id]||d[id].pct<v.pct)d[id]=v;localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const KEYS=['أ','ب','ج','د'];
let st=null,timer=null;

function home(){
  clearInterval(timer);const sc=load();
  app.innerHTML=`<header class="text-center mb-8 fade"><div class="text-5xl mb-2"><i class="fa-solid fa-book-quran gold"></i></div>
  <h1 class="text-3xl md:text-4xl font-extrabold gold">اللغة العربية (الجزء الثاني) — السادس الإعدادي</h1>
  <p class="text-slate-300 mt-2">اختبارات تفاعلية مع تغذية راجعة فورية وتفسير لكل سؤال</p></header>
  <div class="grid gap-4 md:grid-cols-2">${DATA.map((c,i)=>{const s=sc[i];return `<button onclick="start(${i})" class="glass p-5 text-right fade hover:-translate-y-1 transition">
   <div class="flex items-center justify-between mb-2"><span class="text-xs px-2 py-1 rounded-full bg-teal-500/20 text-teal-200">${c.questions.length} سؤالاً</span>
   ${s?`<span class="text-sm gold font-bold"><i class="fa-solid fa-trophy"></i> ${s.pct}%</span>`:'<span class="text-xs text-slate-400">لم يُحلّ بعد</span>'}</div>
   <div class="font-bold text-lg">${esc(c.title)}</div></button>`}).join('')}</div>`;
}
function start(i){
  const c=DATA[i];
  const qs=shuffle(c.questions).map(q=>q.t==='mcq'?{...q,opts:shuffle(q.o.map((t,j)=>({t,ok:j===0})))}:{...q,opts:[{t:'صحيحة',ok:q.a},{t:'خاطئة',ok:!q.a}]});
  st={i,qs,n:0,score:0,wrong:[],left:qs.length*45,answered:false};
  clearInterval(timer);timer=setInterval(()=>{st.left--;const t=$('#tm');if(t)t.textContent=fmt(st.left);if(st.left<=0){clearInterval(timer);finish()}},1000);
  render();
}
const fmt=s=>`${String(Math.max(0,s)/60|0).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`;
function render(){
  const q=st.qs[st.n],tot=st.qs.length;
  app.innerHTML=`<div class="fade">
  <div class="flex items-center justify-between mb-3 text-sm"><button onclick="home()" class="text-slate-300 hover:text-white"><i class="fa-solid fa-house"></i> قائمة الاختبارات</button>
   <span class="glass px-3 py-1"><i class="fa-regular fa-clock text-teal-300"></i> <b id="tm">${fmt(st.left)}</b></span>
   <span class="gold font-bold">${st.n+1} / ${tot}</span></div>
  <div class="bar mb-5"><i style="width:${st.n/tot*100}%"></i></div>
  <div class="glass p-5 md:p-7">
   ${q.t==='tf'?'<span class="text-xs px-2 py-1 rounded-full bg-amber-400/15 text-amber-200">حدّد: صحيحة أم خاطئة؟</span>':''}
   <h2 class="text-xl md:text-2xl font-bold my-3 leading-relaxed">${esc(q.q)}</h2>
   <div id="opts" class="grid gap-3 mt-4">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j})"><span class="k">${KEYS[j]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
   <div id="fb" class="mt-5"></div></div></div>`;
  st.answered=false;
}
function pick(j){
  if(st.answered)return;st.answered=true;
  const q=st.qs[st.n],good=q.opts[j].ok,btns=[...document.querySelectorAll('.opt')];
  btns.forEach((b,k)=>{b.disabled=true;if(q.opts[k].ok)b.classList.add('ok');else if(k===j)b.classList.add('bad')});
  if(good)st.score++;else st.wrong.push({q,chosen:q.opts[j].t});
  const last=st.n===st.qs.length-1;
  $('#fb').innerHTML=`<div class="rounded-xl p-4 fade ${good?'bg-green-500/15 border border-green-500/40':'bg-red-500/15 border border-red-500/40'}">
   <div class="font-bold mb-1">${good?'✅ إجابة صحيحة، أحسنت!':'❌ إجابة خاطئة'}</div>
   <div class="text-slate-100 leading-relaxed">💡 ${esc(q.e)}</div>
   ${q.p?`<div class="text-xs text-amber-200/90 mt-2">صفحة ${q.p}</div>`:''}</div>
   <button class="btn mt-4 w-full" onclick="${last?'finish()':'next()'}">${last?'عرض النتيجة <i class="fa-solid fa-flag-checkered"></i>':'السؤال التالي <i class="fa-solid fa-arrow-left"></i>'}</button>`;
}
function next(){st.n++;render()}
function finish(){
  clearInterval(timer);const tot=st.qs.length,pct=Math.round(st.score/tot*100);
  save(st.i,{pct,score:st.score,total:tot,date:new Date().toLocaleDateString('ar-IQ')});
  const msg=pct>=90?['🏆 ممتاز! أنت بطل المادة','سجل شارة التميّز الذهبية']:pct>=75?['🌟 جيد جداً، استمر','اقتربت من القمة']:pct>=50?['👍 جيد، يمكنك التحسّن','راجع أخطاءك وأعد المحاولة']:['💪 لا تيأس','راجع الدرس ثم أعد الاختبار'];
  const badges=[pct>=50&&['fa-medal','ناجح'],pct>=75&&['fa-star','متفوق'],pct===100&&['fa-crown','علامة كاملة'],st.left>st.qs.length*20&&['fa-bolt','سريع']].filter(Boolean);
  app.innerHTML=`<div class="glass p-6 md:p-8 text-center fade">
   <div class="relative w-40 h-40 mx-auto my-4"><svg viewBox="0 0 36 36" class="w-40 h-40 -rotate-90"><circle cx="18" cy="18" r="15.9" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"/>
   <circle cx="18" cy="18" r="15.9" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" stroke-dasharray="${pct} 100"/></svg>
   <div class="absolute inset-0 grid place-items-center text-4xl font-extrabold gold">${pct}%</div></div>
   <h2 class="text-2xl font-extrabold">${msg[0]}</h2><p class="text-slate-300 mt-1">${msg[1]} — ${st.score} من ${tot}</p>
   <div class="flex flex-wrap gap-2 justify-center my-4">${badges.map(b=>`<span class="px-3 py-1 rounded-full bg-amber-400/15 text-amber-200 text-sm"><i class="fa-solid ${b[0]}"></i> ${b[1]}</span>`).join('')}</div>
   <div class="flex flex-wrap gap-3 justify-center mt-4">
    <button class="btn" onclick="start(${st.i})"><i class="fa-solid fa-rotate-right"></i> إعادة الاختبار</button>
    ${st.wrong.length?`<button class="btn btn-gold" onclick="review()"><i class="fa-solid fa-magnifying-glass"></i> مراجعة الأخطاء (${st.wrong.length})</button>`:''}
    <button class="btn btn-ghost" onclick="home()"><i class="fa-solid fa-house"></i> قائمة الاختبارات</button></div></div>`;
}
function review(){
  app.innerHTML=`<div class="fade"><button onclick="finish()" class="text-slate-300 mb-3"><i class="fa-solid fa-arrow-right"></i> رجوع للنتيجة</button>
  <div class="grid gap-4">${st.wrong.map(w=>`<div class="glass p-5"><div class="font-bold mb-2">${esc(w.q.q)}</div>
   <div class="text-red-300">❌ إجابتك: ${esc(w.chosen)}</div>
   <div class="text-green-300">✅ الصحيحة: ${esc(w.q.opts.find(o=>o.ok).t)}</div>
   <div class="mt-2 text-slate-100">💡 ${esc(w.q.e)}</div></div>`).join('')}</div></div>`;
}
home();
</script>
</body>
</html>
