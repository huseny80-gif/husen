<style>
:root{--bg1:#050d1a;--bg2:#0a2230;--tq:#14b8a6;--tq2:#0f766e;--gold:#d4af37;--gold2:#f3d97a}
*{font-family:'Cairo','Tajawal',sans-serif}
body{min-height:100vh;color:#e6f1f5;background:radial-gradient(1200px 600px at 80% -10%,#0f4a52 0%,transparent 60%),radial-gradient(900px 500px at 0% 100%,#0b2f4a 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2))}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:1.25rem;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.gold{background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(135deg,var(--tq),var(--tq2));color:#fff;font-weight:700;border-radius:.9rem;padding:.7rem 1.3rem;transition:.2s;border:1px solid rgba(255,255,255,.18)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,184,166,.35)}
.btn-gold{background:linear-gradient(135deg,#b8901f,var(--gold));color:#1a1405}
.btn-ghost{background:rgba(255,255,255,.08)}
.opt{width:100%;text-align:right;padding:.9rem 1.1rem;border-radius:.9rem;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);transition:.2s;display:flex;gap:.75rem;align-items:center}
.opt:not(:disabled):hover{border-color:var(--tq);background:rgba(20,184,166,.12)}
.opt.ok{background:rgba(34,197,94,.22);border-color:#22c55e}
.opt.bad{background:rgba(239,68,68,.22);border-color:#ef4444}
.k{width:2rem;height:2rem;border-radius:.6rem;background:rgba(212,175,55,.18);color:var(--gold2);display:grid;place-items:center;font-weight:800;flex:none}
.bar{height:.55rem;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--tq),var(--gold));transition:width .4s}
.fade{animation:f .35s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<script>
const DATA = [{"chapter": 1, "title": "الفصل الأول: الثرموداينمك", "questions": [{"t": "mcq", "q": "ينص القانون الأول في علم الثرموداينمك على أن:", "o": ["الطاقة لا تفنى ولا تستحدث من العدم ولكن يمكن تحويلها من شكل إلى آخر", "الطاقة تفنى عند تحولها من شكل إلى آخر", "الحرارة تنتقل تلقائياً من الجسم البارد إلى الجسم الحار", "كل تفاعل باعث للحرارة يحدث تلقائياً"], "e": "القانون الأول هو قانون حفظ الطاقة: الطاقة تتحول ولا تفنى ولا تُستحدث.", "p": 10}, {"t": "tf", "q": "يهتم علم الثرموداينمك بالزمن الذي يستغرقه حدوث التفاعل.", "a": false, "e": "الثرموداينمك يبيّن هل التفاعل قابل للحدوث أم لا، أما سرعة التفاعل فمن اهتمام علم الحركيات.", "p": 10}, {"t": "mcq", "q": "النظام الذي تسمح حدوده بتبادل الطاقة فقط ولا تسمح بتغيير كمية مادته هو النظام:", "o": ["المغلق", "المفتوح", "المعزول", "المتجانس"], "e": "النظام المغلق يتبادل الطاقة مع المحيط دون المادة، مثل إناء معدني فيه ماء مغلق بإحكام.", "p": 12}, {"t": "mcq", "q": "يُعد الثرموس مثالاً على النظام:", "o": ["المعزول", "المفتوح", "المغلق", "المتغير"], "e": "النظام المعزول لا يتبادل المادة ولا الطاقة مع المحيط، والثرموس يحفظ حرارة النظام ومادته من التسرب.", "p": 12}, {"t": "mcq", "q": "الحرارة النوعية هي كمية الحرارة اللازمة لرفع درجة حرارة:", "o": ["غرام واحد من المادة درجة سيليزية واحدة", "كتلة m من المادة درجة سيليزية واحدة", "مول واحد من المادة درجة سيليزية واحدة", "لتر واحد من المادة درجة كلفن واحدة"], "e": "الحرارة النوعية تخص كتلة غرام واحد (وحدتها J/g·°C)، أما السعة الحرارية فتخص كتلة معينة m.", "p": 13}, {"t": "mcq", "q": "ما مقدار الحرارة اللازمة لتسخين قطعة حديد كتلتها 870 g من 5°C إلى 95°C، علماً أن الحرارة النوعية للحديد 0.45 J/g·°C؟", "o": ["35235 J", "39150 J", "3523.5 J", "391.5 J"], "e": "q = الحرارة النوعية × الكتلة × التغير في درجة الحرارة = 0.45 × 870 × 90 = 35235 J (أي 35.2 kJ).", "p": 14}, {"t": "mcq", "q": "أي الكميات الآتية تُعد دالة حالة؟", "o": ["الانثالبي", "الحرارة", "الشغل", "المسار الذي يسلكه النظام"], "e": "دالة الحالة تعتمد على الحالة الابتدائية والنهائية فقط، والانثالبي مثال عليها، أما الحرارة والشغل فتعتمدان على المسار.", "p": 15}, {"t": "tf", "q": "الانثالبي خاصية مركزة لا تعتمد على كمية المادة.", "a": false, "e": "الانثالبي دالة حالة وهي خاصية شاملة لأنها تعتمد على كمية المادة؛ فانثالبي تفاعل مولين ضعف انثالبي تفاعل مول واحد.", "p": 16}, {"t": "mcq", "q": "الإشارة الموجبة للتغير في الانثالبي (ΔH) تعني أن العملية:", "o": ["ماصة للحرارة", "باعثة للحرارة", "تلقائية دائماً", "غير قابلة للحدوث"], "e": "ΔH موجبة تعني امتصاص حرارة من المحيط (مثل انصهار الجليد)، وΔH سالبة تعني انبعاث حرارة.", "p": 19}, {"t": "tf", "q": "عند عكس التفاعل الحراري تبقى إشارة انثالبي التفاعل كما هي.", "a": false, "e": "عند عكس العملية تتغير الإشارة: من الموجب إلى السالب إن كانت موجبة في الأصل، ومن السالب إلى الموجب إن كانت سالبة.", "p": 21}, {"t": "mcq", "q": "تُعرَّف انثالبي التكوين القياسية بأنها الحرارة اللازمة (الممتصة أو المنبعثة) لتكوين:", "o": ["مول واحد من أي مركب من عناصره الأساسية بأثبت صورها", "مول واحد من أي مادة حرقاً تاماً مع الأوكسجين", "غرام واحد من المركب من عناصره", "مولين من المركب من مركبات أبسط منه"], "e": "انثالبي التكوين تخص تكوّن مول واحد من المركب من عناصره بأثبت صورها عند 25°C وضغط 1 atm، أما الحرق التام فهو انثالبي الاحتراق.", "p": 22}, {"t": "tf", "q": "الكاربون الماس (diamond) هو الصورة الأثبت لعنصر الكاربون في الظروف القياسية.", "a": false, "e": "الكرافيت هو الصورة الأثبت للكاربون، ولذلك تساوي انثالبي تكوينه القياسية صفراً.", "p": 22}, {"t": "mcq", "q": "ينص قانون هيس على أن التغير في انثالبي التفاعل:", "o": ["هو نفسه سواء تم التفاعل في خطوة واحدة أو في سلسلة من الخطوات", "يزداد كلما زاد عدد خطوات التفاعل", "يعتمد على المسار الذي يسلكه التفاعل", "يساوي دائماً صفراً للتفاعلات التلقائية"], "e": "قانون هيس يعتمد على أن الانثالبي دالة حالة، فيمكن حساب ΔH لتفاعل بجمع تفاعلات أخرى تؤدي إلى النتيجة نفسها.", "p": 27}, {"t": "tf", "q": "قيم انثالبي التبخر وانثالبي الانصهار موجبة دائماً لأنها حرارة ممتصة.", "a": true, "e": "التبخر والانصهار يمتصان حرارة فقيمهما موجبة، أما التكثيف والانجماد فيبعثان حرارة وقيمهما سالبة.", "p": 27}, {"t": "mcq", "q": "الانتروبي (S) هو مقياس:", "o": ["للعشوائية أو لاانتظام النظام", "لكمية الحرارة المنبعثة فقط", "لسرعة التفاعل", "لدرجة حرارة النظام"], "e": "كلما قلّ الانتظام في النظام (عشوائية أكبر) كانت قيمة الانتروبي كبيرة.", "p": 34}, {"t": "mcq", "q": "أي الترتيبات الآتية صحيح لانتروبي حالات المادة؟", "o": ["غاز > سائل > صلب", "صلب > سائل > غاز", "سائل > غاز > صلب", "صلب > غاز > سائل"], "e": "انتروبي الحالة الغازية أكبر من السائلة، والسائلة أكبر من الصلبة، لأن العشوائية تزداد من الصلب إلى الغاز.", "p": 34}, {"t": "mcq", "q": "إذا كانت قيمة طاقة كبس الحرة للتفاعل سالبة (ΔG < 0) فإن التفاعل:", "o": ["يجري تلقائياً", "غير تلقائي", "في حالة اتزان فقط", "لا يحدث مطلقاً"], "e": "إشارة ΔG السالبة تدل على أن التفاعل أو التغير الفيزيائي يجري تلقائياً، والموجبة تدل على أنه غير تلقائي.", "p": 39}, {"t": "mcq", "q": "أي العلاقات الآتية تمثل علاقة كبس عند ثبوت درجة الحرارة والضغط؟", "o": ["ΔG = ΔH − TΔS", "ΔG = ΔH + TΔS", "ΔG = TΔH − ΔS", "ΔG = ΔS − TΔH"], "e": "علاقة كبس: التغير في الطاقة الحرة يساوي التغير في الانثالبي مطروحاً منه حاصل ضرب درجة الحرارة في التغير في الانتروبي.", "p": 39}, {"t": "tf", "q": "إذا كانت ΔH و ΔS كلتاهما موجبتين فإن ΔG تصبح سالبة عندما تكون درجة الحرارة كبيرة.", "a": true, "e": "ΔG تكون سالبة عندما يصبح الحد TΔS أكبر بالمقدار من ΔH، ويتحقق ذلك عند درجات الحرارة العالية.", "p": 41}, {"t": "tf", "q": "عند درجتي حرارة الانصهار والغليان (حالة الاتزان) تساوي قيمة ΔG صفراً.", "a": true, "e": "عند هاتين الدرجتين يحدث اتزان بين الطورين فتكون ΔG مساوية للصفر.", "p": 44}, {"t": "mcq", "q": "تساوي انثالبي التسامي:", "o": ["مجموع انثالبيي الانصهار والتبخر", "انثالبي الانصهار فقط", "الفرق بين انثالبي التبخر والانصهار", "انثالبي التبخر مقسوماً على درجة الغليان"], "e": "التسامي تحول المادة من الصلب إلى الغاز مباشرة، وانثالبيه تساوي مجموع انثالبيي الانصهار والتبخر لأن الانثالبي دالة حالة.", "p": 45}]}, {"chapter": 2, "title": "الفصل الثاني: الاتزان الكيميائي", "questions": [{"t": "mcq", "q": "التفاعلات غير الانعكاسية (التامة) هي التفاعلات التي:", "o": ["يُستهلك فيها أحد المواد المتفاعلة أو ج    <div class="flex items-center justify-between mb-2"><span class="text-xs px-2 py-1 rounded-full bg-teal-500/20 text-teal-200">${c.questions.length} سؤالاً</span>
   ${s?`<span class="text-sm gold font-bold"><i class="fa-solid fa-trophy"></i> ${s.pct}%</span>`:'<span class="text-xs text-slate-400">لم يُحلّ بعد</span>'}</div>
   <div class="font-bold text-lg">${esc(c.title)}</div></button>`}).join('')}</div>`;
}
function start(i){
  const c=DATA[i];
  const qs=shuffle(c.questions).map(q=>q.t==='mcq'?{...q,opts:shuffle(q.o.map((t,j)=>({t,ok:j===0})))}:{...q,opts:[{t:'صحيحة',ok:q.a},{t:'خاطئة',ok:!q.a}]});
  st={i,qs,n:0,score:0,wrong:[],left:qs.length*45,answered:false};
  clearInterval(timer);timer=setInterval(()=>{st.left--;const t=$('#tm');if(t)t.textContent=fmt(st.left);if(st.left<=0){clearInterval(timer);finish()}},1000);
  render();
}
const fmt=s=>`${String(Math.max(0,s)/60|0).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`;
function render(){
  const q=st.qs[st.n],tot=st.qs.length;
  app.innerHTML=`<div class="fade">
  <div class="flex items-center justify-between mb-3 text-sm"><button onclick="home()" class="text-slate-300 hover:text-white"><i class="fa-solid fa-house"></i> قائمة الاختبارات</button>
   <span class="glass px-3 py-1"><i class="fa-regular fa-clock text-teal-300"></i> <b id="tm">${fmt(st.left)}</b></span>
   <span class="gold font-bold">${st.n+1} / ${tot}</span></div>
  <div class="bar mb-5"><i style="width:${st.n/tot*100}%"></i></div>
  <div class="glass p-5 md:p-7">
   ${q.t==='tf'?'<span class="text-xs px-2 py-1 rounded-full bg-amber-400/15 text-amber-200">حدّد: صحيحة أم خاطئة؟</span>':''}
   <h2 class="text-xl md:text-2xl font-bold my-3 leading-relaxed">${esc(q.q)}</h2>
   <div id="opts" class="grid gap-3 mt-4">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j})"><span class="k">${KEYS[j]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
   <div id="fb" class="mt-5"></div></div></div>`;
  st.answered=false;
}
function pick(j){
  if(st.answered)return;st.answered=true;
  const q=st.qs[st.n],good=q.opts[j].ok,btns=[...document.querySelectorAll('.opt')];
  btns.forEach((b,k)=>{b.disabled=true;if(q.opts[k].ok)b.classList.add('ok');else if(k===j)b.classList.add('bad')});
  if(good)st.score++;else st.wrong.push({q,chosen:q.opts[j].t});
  const last=st.n===st.qs.length-1;
  $('#fb').innerHTML=`<div class="rounded-xl p-4 fade ${good?'bg-green-500/15 border border-green-500/40':'bg-red-500/15 border border-red-500/40'}">
   <div class="font-bold mb-1">${good?'✅ إجابة صحيحة، أحسنت!':'❌ إجابة خاطئة'}</div>
   <div class="text-slate-100 leading-relaxed">💡 ${esc(q.e)}</div>
   <div class="text-xs text-amber-200/90 mt-2"><i class="fa-solid fa-book-open"></i> الكتاب — صفحة ${q.p}</div></div>
   <button class="btn mt-4 w-full" onclick="${last?'finish()':'next()'}">${last?'عرض النتيجة <i class="fa-solid fa-flag-checkered"></i>':'السؤال التالي <i class="fa-solid fa-arrow-left"></i>'}</button>`;
}
function next(){st.n++;render()}
function finish(){
  clearInterval(timer);const tot=st.qs.length,pct=Math.round(st.score/tot*100);
  save(st.i,{pct,score:st.score,total:tot,date:new Date().toLocaleDateString('ar-IQ')});
  const msg=pct>=90?['🏆 ممتاز! أنت بطل الكيمياء','سجل شارة التميّز الذهبية']:pct>=75?['🌟 جيد جداً، استمر','اقتربت من القمة']:pct>=50?['👍 جيد، يمكنك التحسّن','راجع أخطاءك وأعد المحاولة']:['💪 لا تيأس','راجع الدرس ثم أعد الاختبار'];
  const badges=[pct>=50&&['fa-medal','ناجح'],pct>=75&&['fa-star','متفوق'],pct===100&&['fa-crown','علامة كاملة'],st.left>st.qs.length*20&&['fa-bolt','سريع']].filter(Boolean);
  app.innerHTML=`<div class="glass p-6 md:p-8 text-center fade">
   <div class="relative w-40 h-40 mx-auto my-4"><svg viewBox="0 0 36 36" class="w-40 h-40 -rotate-90"><circle cx="18" cy="18" r="15.9" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"/>
   <circle cx="18" cy="18" r="15.9" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" stroke-dasharray="${pct} 100"/></svg>
   <div class="absolute inset-0 grid place-items-center text-4xl font-extrabold gold">${pct}%</div></div>
   <h2 class="text-2xl font-extrabold">${msg[0]}</h2><p class="text-slate-300 mt-1">${msg[1]} — ${st.score} من ${tot}</p>
   <div class="flex flex-wrap gap-2 justify-center my-4">${badges.map(b=>`<span class="px-3 py-1 rounded-full bg-amber-400/15 text-amber-200 text-sm"><i class="fa-solid ${b[0]}"></i> ${b[1]}</span>`).join('')}</div>
   <div class="flex flex-wrap gap-3 justify-center mt-4">
    <button class="btn" onclick="start(${st.i})"><i class="fa-solid fa-rotate-right"></i> إعادة الاختبار</button>
    ${st.wrong.length?`<button class="btn btn-gold" onclick="review()"><i class="fa-solid fa-magnifying-glass"></i> مراجعة الأخطاء (${st.wrong.length})</button>`:''}
    <button class="btn btn-ghost" onclick="home()"><i class="fa-solid fa-house"></i> قائمة الاختبارات</button></div></div>`;
}
function review(){
  app.innerHTML=`<div class="fade"><button onclick="finish()" class="text-slate-300 mb-3"><i class="fa-solid fa-arrow-right"></i> رجوع للنتيجة</button>
  <div class="grid gap-4">${st.wrong.map(w=>`<div class="glass p-5"><div class="font-bold mb-2">${esc(w.q.q)}</div>
   <div class="text-red-300">❌ إجابتك: ${esc(w.chosen)}</div>
   <div class="text-green-300">✅ الصحيحة: ${esc(w.q.opts.find(o=>o.ok).t)}</div>
   <div class="mt-2 text-slate-100">💡 ${esc(w.q.e)}</div><div class="text-xs text-amber-200/90 mt-1">صفحة ${w.q.p}</div></div>`).join('')}</div></div>`;
}
home();
</script>
</body>
</html>
