const KEY='curr6-v1';let st={};try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const GR=(function(){var m=location.search.match(/[?&]g=(\d)/);var g=m?+m[1]:6;return [4,5,6].indexOf(g)<0?6:g})();
const GN={4:'الرابع',5:'الخامس',6:'السادس'};
document.getElementById('gp').innerHTML=[4,5,6].map(g=>`<a href="curriculum.html?g=${g}" style="${g===GR?'background:linear-gradient(135deg,#14b8a6,#0f766e);border-color:#14b8a6;font-weight:700':''}">${GN[g]} الإعدادي</a>`).join('');

document.title='مكتبة المناهج — '+GN[GR]+' الإعدادي';
document.querySelector('h1').textContent='مكتبة المناهج — '+GN[GR]+' الإعدادي';
const BOOKS_ALL=BOOKS;BOOKS.forEach(b=>{b.g=b.g||6});
let cur='all',term='';
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hl=s=>{s=esc(s);if(!term)return s;const i=s.indexOf(esc(term));return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+esc(term).length)+'</mark>'+s.slice(i+esc(term).length)};
const id=(b,c,l)=>`${b}:${c}:${l}`;
function prog(b){let n=0,d=0;b.ch.forEach((c,ci)=>c.l.forEach((_,li)=>{n++;if(st[id(b.id,ci,li)])d++}));return[d,n]}
function render(){
 const tabs=document.getElementById('tabs');
 tabs.innerHTML=[['all','الكل']].concat(BOOKS.filter(b=>b.g===GR).map(b=>[b.id,b.t])).map(([k,t])=>`<button class="tab ${cur===k?'on':''}" data-k="${k}">${t}</button>`).join('');
 let D=0,N=0;BOOKS.filter(b=>b.g===GR).forEach(b=>{const[d,n]=prog(b);D+=d;N+=n});
 document.getElementById('tot').textContent=`أنجزت ${D} من ${N} درساً`;
 const out=document.getElementById('out');let html='';
 BOOKS.filter(b=>b.g===GR&&(cur==='all'||cur===b.id)).forEach(b=>{
  const[d,n]=prog(b);const pct=n?Math.round(d/n*100):0;let chs='';
  b.ch.forEach((c,ci)=>{

  });
  if(!chs)return;
  html+=`<section class="book"><div class="bh"><div class="ic"><i class="fa-solid ${b.i}"></i></div><div><h2>${b.t}</h2><small>${b.sub}</small></div><span class="sp"></span><span class="pill">${b.ch.length} ${b.id==='ar1'||b.id==='ar2'||b.id==='isl'?'وحدات':b.id==='en'?'Units':'فصول'}</span>${n?`<span class="pill">${pct}%</span>`:''}</div>${n?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}${chs}${b.quiz?`<div class="act"><a class="btn" href="${b.quiz}"><i class="fa-solid fa-circle-question"></i> اختبارات المادة</a></div>`:''}</section>`;
 });
 out.innerHTML=html||(BOOKS.some(b=>b.g===GR)?'<div class="empty">لا توجد نتائج مطابقة</div>':'<div class="empty">لم تُضف كتب هذا الصف إلى المكتبة بعد.</div>');
}
