<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استوديو المواد والاختبارات — المنصة التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== استوديو المواد والاختبارات: ملف واحد مستقل (HTML + CSS + JS) =====
   الألوان: كحلي/أسود بترولي للخلفية، توركواز للتفاعل، ذهبي للعناوين والشارات */
:root{--bg1:#050d1a;--bg2:#0a2230;--tq:#14b8a6;--tq2:#2dd4bf;--gold:#d4af37;--gold2:#f3d97a;--tx:#e6f1f5;--mut:#9fb6bf;
--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box;font-family:'Cairo','Tajawal',system-ui,sans-serif}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--tx);background:radial-gradient(1100px 600px at 85% -10%,#0f4a52,transparent 60%),radial-gradient(900px 500px at 0 100%,#0b2f4a,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right)) 60px max(14px,env(safe-area-inset-left))}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.top a,.top button{display:inline-flex;gap:6px;align-items:center;text-decoration:none;cursor:pointer;background:rgba(8,24,38,.78);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:700;font-size:.9rem;color:var(--tx)}
.top a:hover,.top button:hover{border-color:var(--tq)}
h1{margin:.2rem 0;font-size:clamp(1.5rem,4.5vw,2.2rem);font-weight:800;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:0 0 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px;position:sticky;top:0;z-index:20;padding:8px;border-radius:1rem;background:rgba(5,13,26,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
.tab{flex:1;min-width:110px;padding:10px 12px;border-radius:.8rem;border:1px solid transparent;background:transparent;cursor:pointer;font-weight:700;color:var(--mut)}
.tab[aria-selected=true]{background:linear-gradient(135deg,rgba(20,184,166,.35),rgba(20,184,166,.15));border-color:var(--tq);color:#fff}
.card{background:var(--glass);border:1px solid var(--line);border-radius:1.1rem;padding:16px;margin-bottom:14px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 36px rgba(0,0,0,.3)}
.card h2,.card h3{margin:.1rem 0 .6rem;color:var(--gold2)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:.75rem;padding:8px 14px;font-weight:700;transition:.15s}
.btn:hover{border-color:var(--tq)}
.btn.pri{background:linear-gradient(135deg,var(--tq),#0d9488);border-color:transparent;color:#032a27}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2b2100;border-color:transparent}
.btn.dng{border-color:rgba(239,68,68,.5);color:#fca5a5}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--mut)}
.chip.g{border-color:rgba(212,175,55,.5);color:var(--gold2)}.chip.t{border-color:rgba(20,184,166,.5);color:var(--tq2)}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;padding:9px 12px;border-radius:.7rem;border:1px solid var(--line);background:rgba(2,10,20,.55);outline:none}
select option{background:#0a2230}
input:focus,select:focus,textarea:focus{border-color:var(--tq);box-shadow:0 0 0 3px rgba(20,184,166,.2)}
textarea{min-height:110px;resize:vertical;line-height:1.7}
label.l{display:block;margin:10px 0 4px;color:var(--mut);font-size:.88rem;font-weight:600}
.muted{color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:28px 8px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{color:var(--gold2);font-size:.85rem}
.tw{overflow-x:auto}
/* مودال */
dialog{border:1px solid var(--line);border-radius:1.2rem;background:linear-gradient(160deg,#0b1d2e,#0a2a36);color:var(--tx);padding:18px;width:min(640px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(2,8,16,.7);backdrop-filter:blur(4px)}
/* toast */
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;background:rgba(10,34,48,.95);border:1px solid var(--tq);padding:10px 18px;border-radius:99px;transition:.3s;z-index:99;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* الاختبار */
.q{position:relative}
.q .qh{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.q .qn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2b2100;font-weight:800}
.q .qt{font-size:1.05rem;line-height:1.9;margin:4px 0 10px}
.q.ok{border-color:rgba(34,197,94,.6)}.q.bad{border-color:rgba(239,68,68,.6)}.q.pend{border-color:rgba(245,158,11,.6)}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:.8rem;cursor:pointer;background:rgba(255,255,255,.04)}
.opt:hover{border-color:var(--tq)}.opt.sel{border-color:var(--tq);background:rgba(20,184,166,.18)}
.opt.right{border-color:var(--ok);background:rgba(34,197,94,.18)}.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.16)}
.opt input{accent-color:var(--tq)}
.fb{margin-top:10px;padding:10px 12px;border-radius:.8rem;background:rgba(2,10,20,.5);border:1px dashed var(--line);line-height:1.8}
.fb b{color:var(--gold2)}
.blank{display:inline-block;width:150px;max-width:60vw;padding:3px 8px;margin:0 4px;text-align:center}
.passage{padding:14px;border-radius:.9rem;border:1px solid rgba(212,175,55,.35);background:rgba(212,175,55,.06);line-height:2;direction:ltr;text-align:left;margin-bottom:12px}
.sub-q{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
/* المطابقة */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.mt{grid-template-columns:1fr}}
.mt .slot{min-height:44px;padding:8px 10px;border:1px dashed var(--tq);border-radius:.7rem;margin-top:6px;background:rgba(20,184,166,.07);cursor:pointer}
.mt .slot.full{border-style:solid;background:rgba(20,184,166,.2)}
.mt .lt{padding:8px 10px;border-radius:.7rem;background:rgba(255,255,255,.07);margin-top:10px;font-weight:600}
.mt .chipx{display:block;padding:8px 10px;margin-bottom:6px;border:1px solid var(--line);border-radius:.7rem;background:rgba(255,255,255,.07);cursor:grab;user-select:none}
.mt .chipx.sel{border-color:var(--gold);background:rgba(212,175,55,.2)}.mt .chipx.used{opacity:.35}
/* صندوق الإجابة */
.sb{border:1px solid var(--line);border-radius:.9rem;overflow:hidden;background:rgba(2,10,20,.4)}
.sbt{display:flex;background:rgba(255,255,255,.05)}
.sbt button{flex:1;padding:9px 6px;border:0;background:transparent;cursor:pointer;font-weight:700;color:var(--mut);border-bottom:2px solid transparent}
.sbt button.on{color:#fff;border-bottom-color:var(--tq);background:rgba(20,184,166,.12)}
.sbp{padding:10px}
.sci{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.sci button{min-width:34px;padding:3px 8px;border-radius:.5rem;border:1px solid var(--line);background:rgba(255,255,255,.07);cursor:pointer}
.prev{margin-top:6px;padding:8px 10px;border-radius:.6rem;background:rgba(20,184,166,.1);direction:ltr;text-align:left;min-height:34px;font-size:1.1rem;word-break:break-word}
.pen-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--tq)}
canvas.pad{width:100%;height:280px;display:block;border-radius:.7rem;border:1px solid var(--line);touch-action:none;cursor:crosshair;
background:#0c1f2d;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:100% 32px}
.thumb{max-width:100%;max-height:200px;border-radius:.6rem;border:1px solid var(--line);margin-top:6px;background:#fff}
.prog{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tq),var(--gold));transition:width .15s}
.score{font-size:2.6rem;font-weight:800;color:var(--gold2);text-align:center}
.badge{display:inline-flex;gap:6px;padding:6px 14px;border-radius:99px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2b2100;font-weight:800}
.hl{outline:2px solid var(--gold);outline-offset:3px}
/* زر الطباعة العائم */
#fab{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:60}
#fab button{display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:99px;border:1px solid rgba(243,217,122,.6);background:linear-gradient(135deg,#d4af37,#f3d97a);color:#1a1400;font-weight:800;cursor:pointer;box-shadow:0 8px 26px rgba(0,0,0,.45);font-family:inherit;font-size:.95rem}
#fab button:hover{filter:brightness(1.08)}
#paper{display:none}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25;font-size:.95em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}.frac>span:last-child{padding:0 4px}
.rad{display:inline-flex;align-items:flex-end;direction:ltr}.rad .rs{font-size:1.25em;line-height:1}.rad .rb{border-top:1.5px solid currentColor;padding:0 3px;margin-top:2px}.rad>sup{font-size:.6em;align-self:flex-start;margin-inline-end:-2px}
.mx{direction:ltr;unicode-bidi:isolate;display:inline-block}
.fig{margin:10px 0;padding:8px;border:1px solid var(--line);border-radius:.9rem;background:rgba(0,0,0,.18);text-align:center}.fig svg,.figbg svg{max-width:100%;height:auto;display:block;margin:0 auto}
.padwrap.has{max-width:640px;margin:0 auto;position:relative;border-radius:.7rem;border:1px solid var(--line);background:#0c1f2d}.padwrap.has .figbg{pointer-events:none;padding:6px}
.padwrap.has canvas.pad{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0}
.lrow{display:flex;gap:8px;align-items:center;margin:6px 0}.lrow input{flex:1}
.revc{border-color:#f59e0b!important;color:#fbbf24!important}
a.btn{color:var(--tx);text-decoration:none;display:inline-block}
.gtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.gtab{flex:1;min-width:130px;padding:13px;border-radius:.9rem;border:1px solid var(--line);background:var(--glass);color:var(--mut);font-weight:800;cursor:pointer;font-family:inherit;font-size:1rem}
.gtab[aria-selected=true]{background:linear-gradient(135deg,rgba(20,184,166,.38),rgba(20,184,166,.1));border-color:var(--tq);color:var(--tx)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:12px;border-radius:1rem;border:1px solid var(--line);background:var(--glass);text-align:center}.stat b{display:block;font-size:1.6rem;color:var(--gold2)}.stat span{color:var(--mut);font-size:.82rem}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;color:var(--mut)}.crumb button{background:none;border:0;color:var(--tq2);cursor:pointer;font-weight:700;font-family:inherit;font-size:1rem;padding:0}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.folder{display:flex;flex-direction:column;gap:3px;text-align:start;padding:12px;border-radius:1rem;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;color:var(--tx);font-family:inherit}
.folder:hover{border-color:var(--tq);background:rgba(20,184,166,.1)}.folder small{color:var(--mut)}
.ltabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.lt{padding:9px 14px;border-radius:.8rem;border:1px solid var(--line);background:var(--glass);color:var(--mut);cursor:pointer;font-weight:700;font-family:inherit}
.lt[aria-selected=true]{border-color:var(--tq);color:var(--tx);background:rgba(20,184,166,.18)}.lt.tch{border-color:var(--gold);color:var(--gold2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.sc{padding:12px 14px;border-radius:1rem;border:1px solid var(--line);background:rgba(255,255,255,.05);line-height:1.9;break-inside:avoid}.sc.g{border-color:var(--gold)}
#tbtn.on{border-color:var(--gold)!important;color:var(--gold2)}
details.card>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}details.card>summary::-webkit-details-marker{display:none}
.sum h3{margin:0 0 4px;color:var(--gold2)}.sum h4{margin:12px 0 4px;color:var(--tq2)}.sum ul{margin:4px 0;padding-inline-start:22px;line-height:1.9}
.sum .ls{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pq{margin:10px 0;line-height:1.9;break-inside:avoid}.po{margin:4px 0;padding-inline-start:26px}
.pl{border-bottom:1px solid #999;height:26px;margin:4px 0}
@media print{
 .fig svg,.figbg svg,.padwrap svg{filter:invert(1) hue-rotate(180deg)}
 :root{--bg1:#fff;--bg2:#fff;--tx:#111;--mut:#444;--glass:#fff;--line:#bbb;--gold2:#7a5c00;--tq2:#0f766e;--tq:#0f766e}
 html,body{background:#fff!important;color:#111!important}
 body{min-height:0}
 .tabs,#fab,#toast,.noprint,.nav,#snav,dialog,.top{display:none!important}
 .wrap{max-width:none;padding:0}
 .card{background:#fff!important;border:1px solid #bbb!important;box-shadow:none!important;backdrop-filter:none!important;color:#111!important;break-inside:avoid}
 .chip{background:#fff!important;color:#333!important;border-color:#aaa!important}
 h1,h2,h3,h4{color:#000!important}
 .sum{break-inside:avoid-page}
 body.paper-mode .wrap,body.paper-mode #toast{display:none!important}
 body.paper-mode #paper{display:block;color:#000;font-family:inherit;padding:8px}
 body.paper-mode #paper h1{font-size:1.4rem;margin:0 0 6px;text-align:center}
}
</style>
</head>

  <div class="top">
    <button type="button" id="back">→ رجوع</button>

<script>
'use strict';
/* =====================================================================
   1) أدوات عامة
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const el=(html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3200)}
$('#back').onclick=()=>{if(history.length>1&&document.referrer)history.back();else location.href='platform.html'};

const TYPES={mcq:'اختيار من متعدد',tf:'صح / خطأ',fill:'املأ الفراغ',def:'تعريف',why:'تعليل (لماذا؟)',enum:'تعداد',match:'مطابقة',calc:'مسألة / معادلة',read:'قطعة قراءة',label:'تأشير على الشكل',draw:'ارسم / أكمل الرسم'};
const GRADES={4:'الرابع الإعدادي',5:'الخامس الإعدادي',6:'السادس الإعدادي'};

/* تطبيع النص العربي/الإنجليزي للمقارنة */
const norm=s=>String(s||'').toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[.,،؛:؟!?()"«»\-–_]/g,' ').replace(/\s+/g,' ').trim();

/* =====================================================================
   2) التخزين: الحالة في localStorage، والملفات الكبيرة في IndexedDB
   ===================================================================== */
const LS='studio-v1', SCORES='studio-v1-scores';
const OLDSEED=()=>({v:1,subjects:[
 {id:'chem',name:'الكيمياء',grade:6,lessons:[{id:'chem-eq',title:'الاتزان الكيميائي',kind:'text',link:'',files:[],text:
`التفاعل العكسي هو التفاعل الذي يمكن أن يسير في الاتجاهين الأمامي والعكسي.
الاتزان الكيميائي هو حالة تتساوى فيها سرعة التفاعل الأمامي مع سرعة التفاعل العكسي.
ثابت الاتزان هو النسبة بين تراكيز النواتج وتراكيز المتفاعلات كلٌّ مرفوع لأُسّ معامله في المعادلة الموزونة.
عند زيادة تركيز المتفاعلات يتحرك الاتزان نحو النواتج لأن النظام يحاول تقليل الأثر الواقع عليه.
العوامل التي تؤثر في موضع الاتزان:
- التركيز
- درجة الحرارة
- الضغط
- العامل المساعد لا يغيّر موضع الاتزان بل يسرّع الوصول إليه`}]},
 {id:'phys',name:'الفيزياء',grade:6,lessons:[{id:'phys-el',title:'التيار الكهربائي وقانون أوم',kind:'text',link:'',files:[],text:
`التيار الكهربائي هو معدل تدفق الشحنة الكهربائية عبر مقطع من موصل.
المقاومة الكهربائية هي ممانعة المادة لمرور التيار الكهربائي فيها.
ينص قانون أوم على أن فرق الجهد بين طرفي موصل يتناسب طردياً مع شدة التيار المار فيه عند ثبوت درجة الحرارة.
تسخن الأسلاك عند مرور التيار فيها لأن الإلكترونات تصطدم بذرات الموصل وتفقد جزءاً من طاقتها.
وحدات الكميات الكهربائية في النظام الدولي:
- الأمبير لشدة التيار
- الفولت لفرق الجهد
- الأوم للمقاومة`}]},
 {id:'math',name:'الرياضيات',grade:6,lessons:[{id:'math-d',title:'المشتقة',kind:'text',link:'',files:[],text:
`المشتقة هي معدل تغير الدالة بالنسبة إلى متغيرها المستقل.

const BUL=/^([-•*]|\d+[.)])\s*/;

const WHY_AR=/^(.{8,}?)\s+(لأن|لان|بسبب)\s+(.{6,})$/, WHY_EN=/^(.{8,}?)\s+because\s+(.{6,})$/i;
const factCache=new Map();
function lessonFacts(l){
  const key=l.id+'|'+hash((l.title||'')+'|'+(l.text||'')+'|'+l.kind);
  if(factCache.has(key))return factCache.get(key);
  const lines=(l.text||'').split(/\n/).map(s=>s.trim()).filter(Boolean);
  const sents=[],enums=[];
  for(let i=0;i<lines.length;i++){
    const ln=lines[i];
    if(/[:：]$/.test(ln)){const items=[];let j=i+1;while(j<lines.length&&BUL.test(lines[j])){items.push(lines[j].replace(BUL,''));j++}
      if(items.length>=2){enums.push({h:clean(ln),items});i=j-1;continue}}
    if(BUL.test(ln))continue;
    ln.split(/(?<=[.!?؟])\s+/).forEach(s=>{s=s.trim();if(s.length>=18)sents.push(s)});
  }
  const defs=[],whys=[];
  sents.forEach(s=>{
    const t=clean(s);let m=t.match(isAr(t)?DEF_AR:DEF_EN);
    if(m&&wordsOf(m[1]).length<=5){const kw=[...new Set(wordsOf(m[3]).filter(w=>w.length>=(isAr(w)?4:5)))].slice(0,5);defs.push({term:m[1].trim(),def:t,kw})}
    m=t.match(isAr(t)?WHY_AR:WHY_EN);
    if(m){const a=m[1].trim(),b=isAr(t)?m[3]:m[2];const rest=isAr(t)?m[3]:m[2];
      const kw=[...new Set(wordsOf(rest).filter(w=>w.length>=(isAr(w)?4:5)))].slice(0,5);whys.push({q:a,a:t,kw})}
  });

}
function pickBlank(s,skipFirst=true){
  const w=wordsOf(s);let best=-1,len=0;
  w.forEach((x,i)=>{if(skipFirst&&i===0)return;if(x.length>=(isAr(x)?4:5)&&x.length>=len){best=i;len=x.length}});
  return best<0?null:w[best];
}
function lessonQuestions(sid,l,pool){
  const f=lessonFacts(l),out=[],mk=(kind,i,o)=>out.push({...o,id:'a'+hash(sid+l.id+kind+i+(o.q||'')),sid,lid:l.id,auto:true});
  if(l.kind==='reading'){
    const subs=[];const ss=f.sents;
    ss.forEach((s,i)=>{const b=pickBlank(s);if(!b)return;
      if(i%2===0)subs.push({type:'tf',q:s,a:true,e:'Statement taken from the passage.'});
      else subs.push({type:'fill',q:s.replace(b,'____'),a:[b],e:s})});
    if(subs.length)mk('read',0,{type:'read',q:'Reading comprehension',passage:l.text,subs});
    return out;
  }
  f.defs.forEach((d,i)=>mk('def',i,{type:'def',q:(isAr(d.term)?'عرّف: ':'Define: ')+d.term,a:d.def,k:d.kw}));
  f.whys.forEach((w,i)=>mk('why',i,{type:'why',q:(isAr(w.q)?'علّل: ':'Explain why: ')+w.q,a:w.a,k:w.kw}));
  f.enums.forEach((e,i)=>mk('enum',i,{type:'enum',q:(isAr(e.h)?'عدّد: ':'List: ')+e.h,a:e.items,n:e.items.length}));
  /* اختيار من متعدد: تعريف ← المصطلح، والمشتتات من بقية مصطلحات المادة */
  f.defs.forEach((d,i)=>{
    const others=shuffle(pool.filter(t=>t!==d.term)).slice(0,3);
    if(others.length>=2)mk('mcq',i,{type:'mcq',q:(isAr(d.term)?'أيّ المصطلحات الآتية ينطبق عليه هذا التعريف: «':'Which term matches this definition: "')+d.def.replace(d.term,'…').slice(0,160)+(isAr(d.term)?'»؟':'"?'),o:[d.term,...others],e:d.def});

  f.sents.filter(s=>!/[:：]$/.test(s)).forEach((s,i)=>{
    if(i%2===0){const b=pickBlank(s);if(b){used.add(s);mk('fill',i,{type:'fill',q:s.replace(b,'____'),a:[b],e:s})}}
  });
  const allW=[...new Set(f.sents.flatMap(wordsOf).filter(w=>w.length>=(isAr(w)?5:6)))];
  f.sents.forEach((s,i)=>{
    if(i%2===1){
      const b=pickBlank(s);if(!b)return;
      const cand=allW.filter(w=>w!==b&&!s.includes(w)&&Math.abs(w.length-b.length)<=3);
      if(cand.length){mk('tf',i,{type:'tf',q:s.replace(b,cand[(i*7)%cand.length]),a:false,e:'العبارة الصحيحة: '+s})}
      else mk('tf',i,{type:'tf',q:s,a:true,e:'عبارة صحيحة من الدرس.'})
    }

}
function termPool(sub){return sub.lessons.flatMap(l=>lessonFacts(l).defs.map(d=>d.term))}

const SUBD='₀₁₂₃₄₅₆₇₈₉', SUPD={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻'};
const toSub=d=>d.replace(/\d/g,x=>SUBD[x]), toSup=d=>d.replace(/[\d+\-]/g,x=>SUPD[x]);
function fmt(s,kind){
  s=String(s||'').replace(/<->|<=>/g,'⇌').replace(/->|=>/g,'→').replace(/<=/g,'≤').replace(/>=/g,'≥').replace(/!=/g,'≠')
   .replace(/\^\{?([\d+\-]+)\}?/g,(m,x)=>toSup(x)).replace(/\bsqrt\s*\(/g,'√(').replace(/\bpi\b/gi,'π').replace(/\binf(inity)?\b/gi,'∞').replace(/\bdelta\b/gi,'Δ').replace(/\*/g,'×');
  if(kind==='chem')s=s.replace(/([A-Za-z\)\]])(\d+)/g,(m,a,d)=>a+toSub(d));
  return s;
}

/* عرض منسّق للصيغ: كسور {a/b} وجذور sqrt() وأسس ^ وأدلّة _ — يعيد HTML آمناً */
function rich(src,kind){
  const bal=(t,i,o,c)=>{let d=0;for(let j=i;j<t.length;j++){if(t[j]===o)d++;else if(t[j]===c){d--;if(!d)return j}}return -1};
  const topSlash=t=>{let d=0;for(let j=0;j<t.length;j++){const c=t[j];if(c==='('||c==='{')d++;else if(c===')'||c==='}')d--;else if(c==='/'&&!d)return j}return -1};
  const plain=t=>{t=t.replace(/<->|<=>/g,'⇌').replace(/->|=>/g,'→').replace(/<=/g,'≤').replace(/>=/g,'≥').replace(/!=/g,'≠').replace(/\+-/g,'±').replace(/\*/g,'×')
      .replace(/\bpi\b/gi,'π').replace(/\b[Dd]elta\b/g,'Δ').replace(/\bdeg\b/g,'°').replace(/\binf(inity)?\b/gi,'∞');
    if(kind==='chem')t=t.replace(/([A-Za-z\)\]])(\d+)/g,(m,a,d)=>a+toSub(d));
    return esc(t)};

    for(let i=0;i<t.length;){const ch=t[i];
      if(ch==='{'){const j=bal(t,i,'{','}');if(j>0){fl();const inner=t.slice(i+1,j),k=topSlash(inner);
        out+=k>0?`<span class="frac"><span>${inl(inner.slice(0,k))}</span><span>${inl(inner.slice(k+1))}</span></span>`:inl(inner);i=j+1;continue}}
      if(t.startsWith('sqrt',i)&&(!i||!/[A-Za-z]/.test(t[i-1]))){let j=i+4,idx='';if(t[j]==='['){const e=t.indexOf(']',j);if(e>0){idx=t.slice(j+1,e);j=e+1}}
        if(t[j]==='('){const e=bal(t,j,'(',')');if(e>0){fl();out+=`<span class="rad">${idx?`<sup>${esc(idx)}</sup>`:''}<span class="rs">√</span><span class="rb">${inl(t.slice(j+1,e))}</span></span>`;i=e+1;continue}}}
      if((ch==='^'||ch==='_')&&i>0){let j=i+1,tok=null;

        if(tok!==null){fl();out+=`<${ch==='^'?'sup':'sub'}>${inl(tok)}</${ch==='^'?'sup':'sub'}>`;i=j;continue}}

    fl();return out}

}
/* قيمة عددية لتعبير بسيط (كسور، جذور، أسس، π) — بدون eval */
function evalNum(str){
  const SUPM={'⁰':0,'¹':1,'²':2,'³':3,'⁴':4,'⁵':5,'⁶':6,'⁷':7,'⁸':8,'⁹':9};
  let s=String(str).replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+[...m].map(c=>SUPM[c]).join('')).replace(/[−–]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/π/g,'pi')
    .replace(/\{/g,'(').replace(/\}/g,')').replace(/،/g,'.').replace(/sqrt\[(\d+)\]\(/g,'root$1(').replace(/√\s*\(/g,'sqrt(').replace(/√\s*([\d.]+)/g,'sqrt($1)').replace(/\s+/g,'')
    .replace(/(\d|\))(?=(sqrt|root|pi|\())/g,'$1*').replace(/(pi)(?=[\d(])/g,'$1*');
  let i=0;const bad=()=>{throw 0};
  const num=()=>{const m=s.slice(i).match(/^\d+(\.\d+)?([eE][+-]?\d+)?/);if(!m)bad();i+=m[0].length;return parseFloat(m[0])};
  function atom(){
    if(s.startsWith('pi',i)){i+=2;return Math.PI}
    const f=s.slice(i).match(/^(sqrt|root(\d+))\(/);
    if(f){i+=f[0].length;const v=expr();if(s[i]!==')')bad();i++;return f[1]==='sqrt'?Math.sqrt(v):Math.pow(v,1/+f[2])}
    if(s[i]==='('){i++;const v=expr();if(s[i]!==')')bad();i++;return v}
    return num()}
  function pw(){const b=atom();if(s[i]==='^'){i++;return Math.pow(b,un())}return b}
  function un(){if(s[i]==='-'){i++;return -un()}if(s[i]==='+'){i++;return un()}return pw()}
  function term(){let v=un();while(s[i]==='*'||s[i]==='/'){const o=s[i++],r=un();v=o==='*'?v*r:v/r}return v}
  function expr(){let v=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++],r=term();v=o==='+'?v+r:v-r}return v}
  try{if(!s)return null;const v=expr();return i===s.length&&isFinite(v)?v:null}catch(e){return null}
}
function numFromText(t,whole){

  return null;
}

function submissionBox(q){
  const kind=q.kind||null;
  const root=el(`<div class="sb"><div class="sbt"><button type="button" data-m="t" class="on">✍ كتابة</button><button type="button" data-m="f">📎 ملف / صورة</button><button type="button" data-m="p">🖊 القلم الرقمي</button></div>
  <div class="sbp">
   <div data-p="t">${kind?`<div class="sci">${(SYM[kind]||[]).map(c=>`<button type="button" data-ins="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
     <textarea placeholder="${kind?'اكتب الحل أو المعادلة هنا (مثال: H2 + O2 -> H2O ، x^2 ، sqrt(9))':'اكتب إجابتك هنا…'}"></textarea>
     ${kind?'<div class="prev" aria-label="معاينة منسّقة"></div>':''}</div>
   <div data-p="f" hidden>
     <input type="file" accept="image/*,application/pdf" style="display:none">
     <div class="row"><button type="button" class="btn pri" data-pick>رفع صورة أو PDF للحل</button><span class="muted" data-fn>لم يُرفع ملف</span></div>
     <div class="prog" hidden><i></i></div><div data-pv></div></div>
   <div data-p="p" hidden>
     <div class="pen-tools">
       ${['#ffffff','#38bdf8','#ef4444','#22c55e','#f59e0b','#a855f7'].map((c,i)=>`<button type="button" class="sw${i===0?' on':''}" data-c="${c}" style="background:${c}" aria-label="لون"></button>`).join('')}
       <button type="button" class="btn sm" data-er>ممحاة</button>
       <select data-sz style="width:auto"><option value="2">رفيع</option><option value="4" selected>متوسط</option><option value="8">عريض</option></select>
       <button type="button" class="btn sm dng" data-clr>مسح الكل</button>
       <button type="button" class="btn sm gold" data-save>حفظ الرسم كإجابة</button></div>
     <div class="padwrap${q.fig?' has':''}">${q.fig?`<div class="figbg">${q.fig}</div>`:''}<canvas class="pad"></canvas></div><div data-pp></div></div>
  </div></div>`);
  const st={text:'',file:null,pen:null};let ink=false,dirty=false,figImg=null,doSave=null;
  if(q.fig)svgToImg(q.fig).then(im=>figImg=im);
  const ta=$('textarea',root),prev=$('.prev',root);
  ta.addEventListener('input',()=>{st.text=ta.value;if(prev)prev.innerHTML=rich(ta.value,kind)});
  $$('[data-ins]',root).forEach(b=>b.onclick=()=>{const s=ta.selectionStart??ta.value.length;ta.setRangeText(b.dataset.ins,s,ta.selectionEnd??s,'end');ta.dispatchEvent(new Event('input'));ta.focus()});
  /* تبويبات */
  let padInit=false;
  $$('.sbt button',root).forEach(b=>b.onclick=()=>{$$('.sbt button',root).forEach(x=>x.classList.toggle('on',x===b));$$('[data-p]',root).forEach(p=>p.hidden=p.dataset.p!==b.dataset.m);if(b.dataset.m==='p'&&!padInit){padInit=true;initPad()}});
  /* رفع ملف مع محاكاة التقدّم والمعاينة */
  const fi=$('input[type=file]',root);$('[data-pick]',root).onclick=()=>fi.click();
  fi.onchange=()=>{const f=fi.files[0];if(!f)return;const bar=$('.prog',root),b=$('i',bar);bar.hidden=false;b.style.width='0';let p=0;
    const tk=setInterval(()=>{p+=25;b.style.width=p+'%';if(p>=100){clearInterval(tk);
      $('[data-fn]',root).textContent='✔ تم رفع: '+f.name+' ('+Math.round(f.size/1024)+' ك.ب)';
      const rd=new FileReader();rd.onload=()=>{st.file={name:f.name,type:f.type,url:rd.result};
        $('[data-pv]',root).innerHTML=f.type.startsWith('image/')?`<img class="thumb" alt="معاينة" src="${rd.result}">`:`<div class="fb">ملف PDF: <b>${esc(f.name)}</b> — جاهز للإرسال مع الإجابة.</div>`};rd.readAsDataURL(f)}},120)};
  /* القلم الرقمي */
  function initPad(){
    const cv=$('canvas',root),ctx=cv.getContext('2d');let color='#ffffff',erase=false,draw=false,pts=[];
    const fit=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1,img=cv.width?ctx.getImageData(0,0,cv.width,cv.height):null;
      cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round';ctx.lineJoin='round';if(img)ctx.putImageData(img,0,0)};
    fit();new ResizeObserver(()=>{const r=cv.getBoundingClientRect();if(Math.abs(r.width*(window.devicePixelRatio||1)-cv.width)>2)fit()}).observe(cv);
    const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
    const size=()=>+$('[data-sz]',root).value*(erase?4:1);
    const style=()=>{ctx.globalCompositeOperation=erase?'destination-out':'source-over';ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=size()};
    cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);draw=true;ink=true;dirty=true;pts=[pos(e)];style();ctx.beginPath();ctx.arc(pts[0].x,pts[0].y,ctx.lineWidth/2,0,7);ctx.fill();e.preventDefault()});
    cv.addEventListener('pointermove',e=>{if(!draw)return;const p=pos(e);pts.push(p);style();
      if(pts.length>=3){const a=pts[pts.length-3],b=pts[pts.length-2],c=p;ctx.beginPath();ctx.moveTo((a.x+b.x)/2,(a.y+b.y)/2);ctx.quadraticCurveTo(b.x,b.y,(b.x+c.x)/2,(b.y+c.y)/2);ctx.stroke()}else{ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);ctx.lineTo(p.x,p.y);ctx.stroke()}e.preventDefault()});
    const end=()=>{draw=false;pts=[]};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('pointerleave',end);
    $$('.sw',root).forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;$$('.sw',root).forEach(x=>x.classList.toggle('on',x===b));$('[data-er]',root).classList.remove('pri')});
    $('[data-er]',root).onclick=e=>{erase=!erase;e.target.classList.toggle('pri',erase)};
    $('[data-clr]',root).onclick=()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();st.pen=null;ink=false;dirty=false;$('[data-pp]',root).innerHTML=''};
    $('[data-save]',root).onclick=quiet=>{quiet=quiet===true;const t=document.createElement('canvas');t.width=cv.width;t.height=cv.height;const c=t.getContext('2d');c.fillStyle='#0c1f2d';c.fillRect(0,0,t.width,t.height);if(figImg)c.drawImage(figImg,0,0,t.width,t.height);c.drawImage(cv,0,0);
      /* حفظ كصورة بخلفية داكنة ليبقى الخط الأبيض مقروءاً */
      st.pen=t.toDataURL('image/png');$('[data-pp]',root).innerHTML=`<img class="thumb" alt="رسمك المحفوظ" src="${st.pen}" style="background:#0c1f2d"><div class="row" style="margin-top:6px"><a class="btn sm" download="answer-pen.png" href="${st.pen}">تنزيل الصورة</a><span class="chip t">أُرفق مع إجابتك</span></div>`;dirty=false;if(!quiet)toast('تم حفظ الرسم وإرفاقه بالإجابة')};
    doSave=()=>$('[data-save]',root).onclick(true);
  }
  if(q.startPen)$('[data-m=p]',root).click();
  return {el:root,get:()=>st,hasMedia:()=>{if(ink&&dirty&&doSave)doSave();return !!(st.file||st.pen)},text:()=>st.text};
}

/* =====================================================================
   6) عرض الأسئلة وتصحيحها
   ===================================================================== */
const kwScore=(ans,kws)=>{if(!kws||!kws.length)return 0;const n=norm(ans);return kws.filter(k=>n.includes(norm(k).slice(0,Math.max(3,norm(k).length-1)))).length/kws.length};
const fbHTML=(label,body)=>`<div class="fb"><b>${label}</b> ${body}</div>`;

/* كل دالة render تعيد {el,grade()} حيث grade تعيد {pts,max,pending?,html?} */
const R={};
R.mcq=(q)=>{
  const opts=shuffle(q.o.map((t,i)=>({t,ok:i===0}))),n=opts.length;let sel=-1;
  const root=el(`<div>${opts.map((o,i)=>`<label class="opt" data-i="${i}"><input type="radio" name="r${q._u}"><span>${esc(o.t)}</span></label>`).join('')}</div>`);
  $$('.opt',root).forEach(l=>l.onclick=()=>{sel=+l.dataset.i;$$('.opt',root).forEach(x=>x.classList.toggle('sel',x===l))});
  return {el:root,grade(){const ok=sel>=0&&opts[sel].ok;$$('.opt',root).forEach((l,i)=>{if(opts[i].ok)l.classList.add('right');else if(i===sel)l.classList.add('wrong')});
    return {pts:ok?1:0,max:1,html:q.e?fbHTML('الشرح:',esc(q.e)):''}}}
};
R.tf=(q)=>{
  let v=null;const root=el(`<div class="row"><button type="button" class="btn" data-v="1">✔ صح</button><button type="button" class="btn" data-v="0">✘ خطأ</button></div>`);
  $$('button',root).forEach(b=>b.onclick=()=>{v=b.dataset.v==='1';$$('button',root).forEach(x=>x.classList.toggle('pri',x===b))});
  return {el:root,grade(){const ok=v===!!q.a;return {pts:ok?1:0,max:1,html:fbHTML('الإجابة الصحيحة: '+(q.a?'صح':'خطأ')+'.',esc(q.e||''))}}}
};
R.fill=(q)=>{
  const parts=String(q.q).split('____'),inputs=[];
  const root=el('<div class="qt" style="margin:0"></div>');
  parts.forEach((p,i)=>{root.append(document.createTextNode(p));if(i<parts.length-1){const inp=el('<input type="text" class="blank" autocomplete="off">');inputs.push(inp);root.append(inp)}});
  return {el:root,qtHandled:true,grade(){let ok=0;inputs.forEach((inp,i)=>{const exp=String((q.a||[])[i]??'').split('|').map(norm);if(exp.includes(norm(inp.value))){ok++;inp.style.borderColor='var(--ok)'}else inp.style.borderColor='var(--bad)'});
    return {pts:ok,max:Math.max(1,inputs.length),html:fbHTML('الإجابة:',esc((q.a||[]).join(' ، '))+(q.e?'<br>'+esc(q.e):''))}}}
};
function subjective(q,sci){
  const box=submissionBox({kind:sci});const root=box.el;
  return {el:root,box,textOf:()=>box.text()};
}
R.def=R.why=(q)=>{
  const b=submissionBox({});
  return {el:b.el,grade(){const t=b.text().trim();
    if(!t&&b.hasMedia())return {pts:0,max:1,pending:true,html:fbHTML('الإجابة النموذجية:',`<span class="mx">${rich(q.a)}</span>`)+fbHTML('الحالة:','بانتظار مراجعة المدرب لإجابتك المرفقة (ملف/رسم).')};
    const s=kwScore(t,q.k||[]),pts=s>=.6?1:s>=.3?.5:0;
    return {pts,max:1,html:fbHTML('الإجابة النموذجية:',`<span class="mx">${rich(q.a)}</span>`)+fbHTML('تقدير تلقائي:',`تطابقت ${Math.round(s*100)}٪ من الكلمات المفتاحية.`+(q.k&&q.k.length?` (${esc(q.k.join(' ، '))})`:''))}}}
};
R.enum=(q)=>{
  const b=submissionBox({});$('textarea',b.el).placeholder='اكتب العناصر، كل عنصر في سطر أو افصل بينها بفاصلة…';
  return {el:b.el,grade(){const t=b.text().trim();
    if(!t&&b.hasMedia())return {pts:0,max:1,pending:true,html:fbHTML('المطلوب:',esc(q.a.join(' ، ')))+fbHTML('الحالة:','بانتظار مراجعة المدرب.')};
    const got=t.split(/[\n,،؛;]+/).map(norm).filter(Boolean);
    const hit=q.a.filter(x=>{const nx=norm(x).split(' ').slice(0,3).join(' ');return got.some(g=>g&&(g.includes(nx)||nx.includes(g)))}).length;
    return {pts:Math.min(1,hit/q.a.length),max:1,html:fbHTML('المطلوب ('+q.a.length+'):',esc(q.a.join(' ، '))+`<br>أصبتَ ${hit} من ${q.a.length}.`)}}}
};
R.calc=(q)=>{
  const b=submissionBox({kind:q.kind||'math'});
  return {el:b.el,grade(){const t=b.text().trim();
    const sol=q.sol?fbHTML('الحل النموذجي:',`<span class="mx">${rich(q.sol,q.kind)}</span>`):'';
    if(!t&&b.hasMedia())return {pts:0,max:1,pending:true,html:fbHTML('الجواب:',esc((q.a||[])[0]||''))+sol+fbHTML('الحالة:','بانتظار مراجعة المدرب لحلّك المرفق (ملف/قلم رقمي).')};
    let ok=(q.a||[]).some(x=>canon(x)===canon(t));
    if(!ok&&t){const v=q.num!=null?numFromText(t):numFromText(t,true),cand=q.num!=null?[q.num]:(q.a||[]).map(x=>numFromText(String(x),true)).filter(x=>x!=null);
      if(v!=null&&cand.some(c=>near(v,c,q.tol)))ok=true}
    return {pts:ok?1:0,max:1,html:fbHTML('الجواب الصحيح:',`<span class="mx">${rich((q.a||[])[0]||'',q.kind)}</span>`)+sol+(b.hasMedia()&&!ok?fbHTML('ملاحظة:','أُرفق حلّك المكتوب بخط اليد لمراجعة المدرب.'):'')}}}
};
R.match=(q)=>{
  const L=q.pairs.map(p=>p[0]),Rt=shuffle(q.pairs.map((p,i)=>({t:p[1],i}))),place=new Array(L.length).fill(-1);let held=-1;
  const root=el(`<div class="mt"><div>${L.map((l,i)=>`<div class="lt">${esc(l)}</div><div class="slot" data-s="${i}">اسحب التعريف إلى هنا أو انقر</div>`).join('')}</div>
    <div>${Rt.map((r,k)=>`<span class="chipx" draggable="true" data-k="${k}">${esc(r.t)}</span>`).join('')}</div></div>`);
  const paint=()=>{$$('.slot',root).forEach((s,i)=>{const k=place[i];s.classList.toggle('full',k>=0);s.textContent=k>=0?Rt[k].t:'اسحب التعريف إلى هنا أو انقر'});
    $$('.chipx',root).forEach((c,k)=>{c.classList.toggle('used',place.includes(k));c.classList.toggle('sel',held===k)})};
  const put=(i,k)=>{const o=place.indexOf(k);if(o>=0)place[o]=-1;place[i]=k;held=-1;paint()};
  $$('.chipx',root).forEach(c=>{const k=+c.dataset.k;c.onclick=()=>{held=held===k?-1:k;paint()};c.ondragstart=e=>{e.dataTransfer.setData('text/plain',k);held=k}});
  $$('.slot',root).forEach(s=>{const i=+s.dataset.s;s.onclick=()=>{if(held>=0)put(i,held);else if(place[i]>=0){place[i]=-1;paint()}};
    s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();const k=+e.dataTransfer.getData('text/plain');if(!isNaN(k))put(i,k)}});
  return {el:root,grade(){let ok=0;$$('.slot',root).forEach((s,i)=>{const good=place[i]>=0&&Rt[place[i]].i===i;if(good)ok++;s.style.borderColor=good?'var(--ok)':'var(--bad)'});
    return {pts:ok,max:L.length,html:fbHTML('المطابقة الصحيحة:',q.pairs.map(p=>esc(p[0])+' ← '+esc(p[1])).join('<br>'))}}}
};
R.short=(q)=>{const g=R.def({...q,a:q.a||''});return g};
R.label=(q)=>{
  const root=el(`<div>${q.fig?`<div class="fig">${q.fig}</div>`:''}${(q.labels||[]).map(l=>`<div class="lrow"><span class="chip g">${esc(l.n)}</span><input type="text" data-n="${esc(l.n)}" autocomplete="off" placeholder="اسم الجزء رقم ${esc(l.n)}"></div>`).join('')}</div>`);
  return {el:root,grade(){let ok=0;const L=q.labels||[];
    $$('input',root).forEach((inp,i)=>{const v=norm(inp.value),l=L[i];const good=!!v&&[l.a,...(l.k||[])].some(x=>{const nx=norm(x);return v.includes(nx)||(v.length>=3&&nx.includes(v))});if(good)ok++;inp.style.borderColor=good?'var(--ok)':'var(--bad)';inp.disabled=true});
    return {pts:ok,max:L.length,html:fbHTML('التأشير الصحيح:',L.map(l=>`${esc(l.n)}) ${esc(l.a)}`).join('<br>'))}}}
};
R.draw=(q)=>{
  const b=submissionBox({fig:q.fig,startPen:true});
  return {el:b.el,grade(){const t=b.text().trim();
    const model=fbHTML('الرسم / الإجابة النموذجية:',`<span class="mx">${rich(q.a,null)}</span>`)+(q.figA?`<div class="fig">${q.figA}</div>`:'');
    if(b.hasMedia())return {pts:0,max:1,pending:true,html:model+fbHTML('الحالة:','رسمك محفوظ وبانتظار مراجعة المدرب — قارنه بالنموذج أعلاه.')};
    if(t&&q.k&&q.k.length){const sc=kwScore(t,q.k);return {pts:sc>=.6?1:sc>=.3?.5:0,max:1,html:model}}
    return {pts:0,max:1,html:model+fbHTML('ملاحظة:','لم تُسجَّل إجابة. ارسم في اللوح ثم سلّم الاختبار.')}}}
};
R.read=(q)=>{
  const root=el(`<div><div class="passage">${esc(q.passage||'').replace(/\n/g,'<br>')}</div><div data-subs></div></div>`);
  const items=[];
  (q.subs||[]).forEach((s,i)=>{const sub=el(`<div class="sub-q"><div class="qt" style="direction:${isAr(s.q)?'rtl':'ltr'};text-align:${isAr(s.q)?'right':'left'}"><b>${i+1}.</b> ${s.type==='fill'?'':esc(s.q)}</div><div data-b></div></div>`);
    const it=R[s.type]({...s,_u:uid()});if(s.type==='fill'){sub.firstElementChild.append(...it.el.childNodes)}else $('[data-b]',sub).append(it.el);
    $('[data-subs]',root).append(sub);items.push({it,sub})});
  return {el:root,grade(){let pts=0,max=0,pend=0,html='';items.forEach(({it,sub},i)=>{const r=it.grade();if(r.pending)pend++;else{pts+=r.pts;max+=r.max}
      const f=el(`<div>${r.html||''}</div>`);sub.append(f)});
    return {pts,max,pending:pend>0&&max===0,html:pend?fbHTML('ملاحظة:',`${pend} سؤالاً مقالياً بانتظار مراجعة المدرب.`):''}}}
};

/* =====================================================================
   7) تبويب الاختبارات
   ===================================================================== */
let exam=null,examPre=null;
function leaveExam(){const b=exam&&exam.back;exam=null;if(b){nav=b;tab='lib'}render()}
function startExam(sid,qs,limit){if(!qs.length){toast('لا توجد أسئلة متاحة لهذا النطاق');return}
  let q=shuffle(qs);if(limit&&isFinite(limit))q=q.slice(0,limit);
  exam={running:true,sid,qs:q,items:[],back:{...nav}};tab='exam';render();window.scrollTo({top:0})}
/* منتقي الفصول: فصل واحد أو أكثر أو كل المادة. يعيد دالة تُرجع مجموعة المعرّفات (أو null = كل المادة) */
function chapterPicker(box,sub,onchange){
  const cs=sub.chapters||[];
  box.innerHTML=`<label class="chip" style="cursor:pointer;border-color:var(--gold)"><input type="checkbox" data-all checked> كل المادة</label>`+
    cs.map(c=>`<label class="chip" style="cursor:pointer"><input type="checkbox" data-c value="${c.id}" checked> ${esc(c.title)}</label>`).join('');
  const all=$('[data-all]',box),each=$$('[data-c]',box);
  all.onchange=()=>{each.forEach(i=>i.checked=all.checked);onchange()};
  each.forEach(i=>i.onchange=()=>{all.checked=each.every(x=>x.checked);onchange()});
  return ()=>all.checked?null:new Set(each.filter(i=>i.checked).map(i=>i.value));
}
const inChapters=(q,sel)=>!sel||(q.cid&&sel.has(q.cid));
const LET=['أ','ب','ج','د','هـ','و'];
function ansOf(q){
  switch(q.type){
   case 'mcq':return q.o[0];
   case 'tf':return q.a?'صح':'خطأ';
   case 'fill':return [].concat(q.a||[]).join(' / ');
   case 'enum':return (q.a||[]).join('، ');
   case 'match':return (q.pairs||[]).map(p=>p[0]+' ← '+p[1]).join(' ؛ ');
   case 'calc':return [].concat(q.a||[])[0]+(q.sol?' — '+q.sol:'');
   case 'label':return (q.labels||[]).map(l=>l.n+') '+l.a).join(' ؛ ');
   default:return typeof q.a==='string'?q.a:[].concat(q.a||[]).join(' ')}
}
function paperItem(q,n,ans){
  let h=`<div class="pq"><b>${n}.</b> <span class="mx" style="display:inline">${rich(q.q,q.kind)}</span>${q.fig&&q.type!=='draw'?`<div class="fig" style="max-width:360px">${q.fig}</div>`:''}`,an='';
  if(q.type==='mcq'){const o=shuffle(q.o);h+='<div class="po">'+o.map((x,i)=>`<div>${LET[i]}) ${esc(x)}</div>`).join('')+'</div>';an=LET[o.indexOf(q.o[0])]+') '+q.o[0]}
  else if(q.type==='tf'){h+=' &nbsp; ( &nbsp; ) صح &nbsp; ( &nbsp; ) خطأ';an=ansOf(q)}
  else if(q.type==='match'){const R2=shuffle((q.pairs||[]).map(p=>p[1]));h+='<table style="width:100%;margin-top:4px"><tbody>'+(q.pairs||[]).map((p,i)=>`<tr><td>${i+1}) ${esc(p[0])}</td><td>(&nbsp;&nbsp;) ${esc(R2[i])}</td></tr>`).join('')+'</tbody></table>';an=ansOf(q)}
  else if(q.type==='label'){h+=(q.labels||[]).map(l=>`<div class="pl" style="height:24px"><b>${esc(l.n)})</b></div>`).join('');an=ansOf(q)}
  else if(q.type==='draw'){h+=(q.fig?`<div class="fig" style="max-width:360px">${q.fig}</div>`:'')+'<div style="border:1px solid #999;height:180px;margin-top:6px"></div>';an=ansOf(q)}
  else if(q.type==='enum'){h+='<div class="pl"></div>'.repeat(Math.min(q.n||3,8));an=ansOf(q)}
  else if(q.type==='fill'){an=ansOf(q)}
  else{h+='<div class="pl"></div><div class="pl"></div>';an=ansOf(q)}
  h+='</div>';
  if(ans)h+=`<div style="margin:-6px 0 10px;padding-inline-start:22px;color:#065f46;font-weight:700">الإجابة: ${esc(an)}</div>`;
  return h;
}
function printPaper(qs,sub,withAns){

    if(q.type==='read'){n++;return `<div class="pq"><b>${n}.</b> اقرأ القطعة ثم أجب:<div style="border:1px solid #999;padding:8px;margin:6px 0;direction:ltr;text-align:left">${esc(q.passage||'')}</div>`+(q.subs||[]).map((x,i)=>paperItem(x,String.fromCharCode(97+i),withAns)).join('')+'</div>'}
    n++;return paperItem(q,n,withAns)}).join('');
  $('#paper').innerHTML=`<h1>${esc(sub.name)} — ${withAns?'نموذج الإجابة':'ورقة أسئلة'}</h1><p style="text-align:center">الاسم: ......................... &nbsp; التاريخ: ............ &nbsp; عدد الأسئلة: ${qs.length}</p>`+body;
  document.body.classList.add('paper-mode');

}

function submitExam(){
  let pts=0,max=0,pend=0;
  exam.items.forEach(({q,it,card})=>{
    const r=it.grade();$$('input,textarea,select,button',card).forEach(x=>{if(!x.closest('.sbt')&&!x.closest('.pen-tools'))x.disabled=true});
    card.style.pointerEvents='auto';
    if(r.pending){pend++;card.classList.add('pend')}else{pts+=r.pts;max+=r.max;card.classList.add(r.pts>=r.max?'ok':r.pts>0?'pend':'bad')}
    $('[data-f]',card).innerHTML=r.html||'';
  });
  const pct=max?Math.round(pts/max*100):0;
  const id='x'+Date.now();saveScore(id,{pct,sid:exam.sid,ts:Date.now(),n:exam.qs.length,pending:pend});
  exam.running=false;exam.done={pct,pts,max,pend};
  const top=el(`<div class="card"><div class="score">${pct}٪</div><p style="text-align:center" class="muted">${pts%1?pts.toFixed(1):pts} من ${max}${pend?` — و${pend} سؤال بانتظار مراجعة المدرب`:''}</p>
    <div class="row" style="justify-content:center">${pct>=90?'<span class="badge">★ شارة التفوق</span>':''}<button class="btn pri" id="xnew">اختبار جديد</button></div></div>`);
  $('#view').prepend(top);$('#xsub').closest('.card').remove();$('#xq').remove();
  $('#xnew').onclick=leaveExam;
  window.scrollTo({top:0,behavior:'smooth'});
}

let sumSid='';
const uniqArr=a=>{const seen=new Set();return a.map(x=>String(x).trim()).filter(x=>{const k=norm(x);if(!x||seen.has(k))return false;seen.add(k);return true})};
function chapterSummary(sub,c){
  const ls=sub.lessons.filter(l=>l.cid===c.id);
  const facts=ls.map(l=>({l,f:lessonFacts(l)}));
  const extra=S.manual.filter(m=>m.sid===sub.id&&m.e&&(m.cid===c.id||ls.some(l=>l.id===m.lid))).map(m=>m.e);
  const pts=uniqArr([...(c.points||[]),...extra,...facts.flatMap(x=>x.f.defs.map(d=>d.def)),...facts.flatMap(x=>x.f.whys.map(w=>w.a))]);
  const enums=facts.flatMap(x=>x.f.enums);
  return {ls,pts,enums,lsum:ls.filter(l=>(l.summary||'').trim())};
}
function summaryHTML(sub,sel){
  const cs=(sub.chapters||[]).filter(c=>!sel||sel.has(c.id));
  if(!cs.length)return '<div class="empty">اختر فصلاً واحداً على الأقل.</div>';
  return cs.map(c=>{const r=chapterSummary(sub,c);
    return `<section class="card sum"><div class="row"><h3>${esc(c.title)}</h3>${c.pages?`<span class="chip">ص ${esc(c.pages)}</span>`:''}<span class="sp"></span><button class="btn sm noprint" data-ec="${c.id}">تعديل ملخص الفصل</button></div>

try{const o=JSON.parse(sessionStorage.getItem(TS)||'null');if(o&&o.exp>Date.now()){teacher=true;tUser=o.email}}catch(e){}
function paintTeacher(){const b=$('#tbtn');b.textContent=teacher?'🎓 وضع المدرس — خروج':'🔒 دخول المدرس';b.classList.toggle('on',teacher);b.title=teacher?tUser:'تسجيل دخول المدرس لإظهار بنك الأسئلة وإدارة المحتوى'}
function setTeacher(on,email,exp){teacher=on;tUser=on?email:'';try{on?sessionStorage.setItem(TS,JSON.stringify({email,exp})):sessionStorage.removeItem(TS)}catch(e){}
  paintTeacher();render();toast(on?'تم تفعيل وضع المدرس':'عدتَ إلى وضع الطالب')}
async function sbLogin(email,password){
  let r;try{r=await fetch(SB.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({email,password})})}
  catch(e){throw new Error('تعذّر الاتصال بالخادم. تحقق من الإنترنت.')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(r.status===400?'البريد أو كلمة المرور غير صحيحة':(j.error_description||j.msg||'تعذّر تسجيل الدخول'));
  return j}
function teacherDialog(){
  modal(`<h3 style="margin-top:0;color:var(--gold2)">دخول المدرس</h3>
   <p class="muted" style="margin-top:0">استخدم حساب المدرس المسجّل في المنصة. يظهر بنك الأسئلة وإدارة المحتوى في هذا الوضع فقط.</p>
   <label class="l" for="te">البريد الإلكتروني</label><input type="email" id="te" dir="ltr" autocomplete="username">
   <label class="l" for="tp">كلمة المرور</label><input type="password" id="tp" dir="ltr" autocomplete="current-password">
   <div id="terr" style="color:#fca5a5;min-height:1.4em;margin-top:6px" role="alert"></div>
   <div class="row" style="margin-top:8px"><span class="sp"></span><button class="btn" id="c">إلغاء</button><button class="btn pri" id="ok">دخول</button></div>`,d=>{
   $('#c',d).onclick=()=>d.close();
   const go=async()=>{const em=$('#te',d).value.trim().toLowerCase(),pw=$('#tp',d).value;if(!em||!pw){$('#terr',d).textContent='أدخل البريد وكلمة المرور';return}
     const b=$('#ok',d);b.disabled=true;b.textContent='جارٍ التحقق…';
     try{const j=await sbLogin(em,pw);const mail=((j.user&&j.user.email)||em).toLowerCase();
       if(!SB.teachers.includes(mail))throw new Error('هذا الحساب ليس حساب مدرس');
       d.close();setTeacher(true,mail,Date.now()+Math.min((j.expires_in||3600)*1000,8*3600e3))}
     catch(e){$('#terr',d).textContent=e.message;b.disabled=false;b.textContent='دخول'}};
   $('#ok',d).onclick=go;$('#tp',d).onkeydown=e=>{if(e.key==='Enter')go()}});
}
$('#tbtn').onclick=()=>teacher?setTeacher(false):teacherDialog();

/* =====================================================================
   10-د) المواد والدروس: الصفوف ← المواد ← مجلد لكل درس بخمسة تبويبات
   ===================================================================== */
let nav={g:6,sid:null,lid:null,lt:'pdf'};
const BOOKS_AVAIL=['chem','phy','bio','math','ar1','ar2','isl','en'];
const bookOf=s=>{const m=/^g6-(.+)$/.exec(s.id);return m&&BOOKS_AVAIL.includes(m[1])?m[1]:null};
const firstNum=v=>{const m=String(v||'').match(/\d+/);return m?+m[0]:0};
function qStats(sub){const all=bank(sub.id),byC={},byL={};all.forEach(q=>{if(q.cid)byC[q.cid]=(byC[q.cid]||0)+1;if(q.lid)byL[q.lid]=(byL[q.lid]||0)+1});return {total:all.length,byC,byL,all}}
function viewLibrary(host){
  if(nav.sid&&nav.lid)return viewLesson(host);
  if(nav.sid)return viewSubject(host);
  const G=[4,5,6],subs=S.subjects.filter(x=>x.grade===nav.g);
  const st=subs.map(x=>({s:x,q:qStats(x)}));
  const T=(f)=>st.reduce((a,x)=>a+f(x),0);
  host.innerHTML=`<div class="gtabs" role="tablist" aria-label="المراحل الدراسية">${G.map(g=>`<button class="gtab" role="tab" aria-selected="${g===nav.g}" data-g="${g}">${GRADES[g]}</button>`).join('')}</div>
   <div class="stats"><div class="stat"><b>${subs.length}</b><span>عدد المواد</span></div><div class="stat"><b>${T(x=>(x.s.chapters||[]).length)}</b><span>الفصول</span></div><div class="stat"><b>${T(x=>x.s.lessons.length)}</b><span>الدروس</span></div><div class="stat"><b>${T(x=>x.q.total)}</b><span>إجمالي الأسئلة</span></div></div>
   ${subs.length?`<div class="grid">${st.map(({s:x,q})=>`<div class="card" style="margin:0"><h3 style="margin:0 0 6px;color:var(--gold2)">${esc(x.name)}</h3>
     <div class="row" style="margin-bottom:10px"><span class="chip">${(x.chapters||[]).length} فصول</span><span class="chip">${x.lessons.length} درساً</span><span class="chip t">${q.total} سؤالاً</span>${bookOf(x)?'<span class="chip g">📘 كتاب PDF</span>':''}</div>
     <button class="btn pri" data-s="${x.id}" style="width:100%">عرض المادة</button></div>`).join('')}</div>`
    :`<div class="card"><div class="empty">لا توجد مواد لـ${GRADES[nav.g]} بعد.${teacher?'':' سيضيفها المدرس قريباً.'}</div></div>`}
   ${teacher?`<div class="row" style="margin-top:12px"><button class="btn" id="adds">+ مادة جديدة لـ${GRADES[nav.g]}</button></div>`:''}`;
  $$('[data-g]',host).forEach(b=>b.onclick=()=>{nav.g=+b.dataset.g;viewLibrary(host)});
  $$('[data-s]',host).forEach(b=>b.onclick=()=>{nav.sid=b.dataset.s;nav.lid=null;render();window.scrollTo({top:0})});
  if(teacher)$('#adds').onclick=()=>editSubject(null,nav.g);
}
const goLib=(sid,lid)=>{nav.sid=sid||null;nav.lid=lid||null;render();window.scrollTo({top:0})};
function viewSubject(host){
  const sub=S.subjects.find(x=>x.id===nav.sid);if(!sub){nav.sid=null;return viewLibrary(host)}
  const q=qStats(sub),bk=bookOf(sub);
  host.innerHTML=`<div class="crumb"><button id="b0">${GRADES[sub.grade]||'المراحل'}</button> › <b>${esc(sub.name)}</b></div>
   <div class="card"><div class="row"><h2 style="margin:0">${esc(sub.name)}</h2><span class="chip">${(sub.chapters||[]).length} فصول</span><span class="chip">${sub.lessons.length} درساً</span><span class="chip t">${q.total} سؤالاً</span><span class="sp"></span>
    ${bk?`<a class="btn sm" href="books/${bk}.pdf" target="_blank" rel="noopener">📘 الكتاب (PDF)</a>`:''}<button class="btn sm gold" id="xs_all">اختبار شامل للمادة</button>${teacher?'<button class="btn sm" id="xl_add">+ درس</button><button class="btn sm" id="xc_add">+ فصل</button>':''}</div></div>
   ${(sub.chapters||[]).map((c,i)=>{const ls=sub.lessons.filter(l=>l.cid===c.id);return `<details class="card" ${i===0?'open':''}><summary><h3 style="margin:0;color:var(--gold2)">📂 ${esc(c.title)}</h3>${c.pages?`<span class="chip">ص ${esc(c.pages)}</span>`:''}<span class="chip">${ls.length} دروس</span><span class="chip t">${q.byC[c.id]||0} سؤالاً</span></summary>
     <div class="row" style="margin-top:10px"><button class="btn sm gold" data-xc="${c.id}">اختبار هذا الفصل</button></div>
     ${ls.length?`<div class="folders">${ls.map(l=>`<button class="folder" data-l="${l.id}"><span style="font-size:1.4rem">📁</span><b>${esc(l.title)}</b><small>${l.page?`ص ${esc(l.page)} · `:''}${q.byL[l.id]?q.byL[l.id]+' سؤالاً':'أسئلة الفصل'}</small></button>`).join('')}</div>`:'<div class="empty">لا توجد دروس مفصّلة لهذا الفصل. استخدم «اختبار هذا الفصل» أو أضف درساً.</div>'}</details>`}).join('')||'<div class="card"><div class="empty">لا توجد فصول بعد.</div></div>'}`;
  $('#b0').onclick=()=>goLib(null);
  $('#xs_all').onclick=()=>{examPre=sub.id;tab='exam';render()};
  $$('[data-xc]',host).forEach(b=>b.onclick=()=>startExam(sub.id,q.all.filter(x=>x.cid===b.dataset.xc)));
  $$('[data-l]',host).forEach(b=>b.onclick=()=>{nav.lid=b.dataset.l;nav.lt='pdf';render();window.scrollTo({top:0})});
  if(teacher){$('#xl_add').onclick=()=>editLesson(sub.id);$('#xc_add').onclick=()=>editChapter(sub.id)}
}
function viewLesson(host){
  const sub=S.subjects.find(x=>x.id===nav.sid),l=sub&&sub.lessons.find(x=>x.id===nav.lid);
  if(!sub||!l){nav.lid=null;return viewLibrary(host)}
  const c=(sub.chapters||[]).find(x=>x.id===l.cid)||{title:'',pages:'',points:[]};
  if(nav.lt==='bank'&&!teacher)nav.lt='pdf';
  const LT=[['pdf','المنهج (PDF)'],['chap','الفصل'],['sum','الملخص'],['quiz','الاختبار التفاعلي']];if(teacher)LT.push(['bank','بنك الأسئلة للمدرس']);
  host.innerHTML=`<div class="crumb"><button id="b0">${GRADES[sub.grade]||'المراحل'}</button> › <button id="b1">${esc(sub.name)}</button> › <b>${esc(l.title)}</b></div>
   <div class="card"><div class="row"><h2 style="margin:0">📁 ${esc(l.title)}</h2>${c.title?`<span class="chip g">${esc(c.title)}</span>`:''}${l.page?`<span class="chip">ص ${esc(l.page)}</span>`:''}<span class="sp"></span>${teacher?'<button class="btn sm" id="le">تعديل الدرس</button>':''}</div></div>
   <div class="ltabs" role="tablist">${LT.map(([k,n])=>`<button class="lt ${k==='bank'?'tch':''}" role="tab" aria-selected="${k===nav.lt}" data-lt="${k}">${k==='bank'?'🔑 ':''}${n}</button>`).join('')}</div><div id="lbody"></div>`;
  $('#b0').onclick=()=>goLib(null);$('#b1').onclick=()=>goLib(sub.id);
  if(teacher)$('#le').onclick=()=>editLesson(sub.id,l.id);
  $$('[data-lt]',host).forEach(b=>b.onclick=()=>{nav.lt=b.dataset.lt;viewLesson(host)});
  const body=$('#lbody'),q=qStats(sub),P={pdf:lessonPdf,chap:lessonChap,sum:lessonSum,quiz:lessonQuiz,bank:lessonBank};
  P[nav.lt](body,sub,l,c,q);
}
function lessonPdf(b,sub,l,c){
  const bk=bookOf(sub),pg=firstNum(l.page)||firstNum(c.pages)||1;
  b.innerHTML=`<div class="card">${bk?`<p class="muted" style="margin-top:0">كتاب «${esc(sub.name)}» — الدرس يبدأ عند الصفحة ${pg}.</p>
    <div class="row"><a class="btn pri" target="_blank" rel="noopener" href="books/${bk}.pdf#page=${pg}">📖 فتح الكتاب عند الصفحة ${pg}</a><a class="btn" href="books/${bk}.pdf" download>⬇ تحميل الكتاب</a><button class="btn" id="vw">عرض هنا</button></div><div id="pv" style="margin-top:12px"></div>`
    :'<div class="empty">لا يوجد كتاب PDF لهذه المادة بعد. أرفق ملفاً من «تعديل الدرس» في وضع المدرس.</div>'}
   ${l.link?`<div style="margin-top:10px"><a class="chip t" href="${esc(l.link)}" target="_blank" rel="noopener">🔗 رابط خارجي للدرس</a></div>`:''}
   ${(l.files||[]).length?`<div class="row" style="margin-top:10px">${l.files.map(f=>`<button class="chip t" style="cursor:pointer" data-file="${f.id}">📎 ${esc(f.name)}</button>`).join('')}</div>`:''}</div>`;
  if(bk)$('#vw',b).onclick=()=>{$('#pv',b).innerHTML=`<iframe title="الكتاب" src="books/${bk}.pdf#page=${pg}" style="width:100%;height:75vh;border:1px solid var(--line);border-radius:12px;background:#fff"></iframe><p class="muted" style="font-size:.8rem">إن لم يظهر الكتاب على هاتفك فاستخدم «فتح الكتاب».</p>`};
  $$('[data-file]',b).forEach(x=>x.onclick=async()=>{const bl=await DB.get(x.dataset.file);if(!bl){toast('الملف غير متاح على هذا الجهاز');return}window.open(URL.createObjectURL(bl),'_blank')});
}
function lessonChap(b,sub,l,c){
  const lines=(l.text||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const r=chapterSummary(sub,c);
  b.innerHTML=`<div class="card">${lines.length?`<div style="line-height:2;font-size:1.02rem">${lines.map(x=>BUL.test(x)?`<div style="padding-inline-start:18px">• ${esc(x.replace(BUL,''))}</div>`:`<p style="margin:6px 0">${esc(x)}</p>`).join('')}</div>`
    :`<div class="empty">لم يُضف الشرح التفصيلي لهذا الدرس بعد.${teacher?' استخدم «تعديل الدرس» لإضافة النص، فتتولّد له الأسئلة والملخص تلقائياً.':''}</div>`}</div>
   ${!lines.length&&r.pts.length?`<div class="card"><h3 style="margin-top:0;color:var(--tq2)">من محتوى الفصل: ${esc(c.title)}</h3><ul style="line-height:1.9">${r.pts.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}`;
}
function lessonSum(b,sub,l,c){
  const r=chapterSummary(sub,c),own=(l.summary||'').trim();
  const cards=[...(own?[`<div class="sc g"><b style="color:var(--gold2)">ملخص الدرس</b><div style="white-space:pre-wrap">${esc(own)}</div></div>`]:[]),
    ...r.pts.map(x=>`<div class="sc">${esc(x)}</div>`),
    ...r.enums.map(e=>`<div class="sc"><b style="color:var(--tq2)">${esc(e.h)}</b><ul style="margin:4px 0">${e.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`),
    ...((c.note||'').trim()?[`<div class="sc g"><b style="color:var(--gold2)">ملاحظات الفصل</b><div style="white-space:pre-wrap">${esc(c.note)}</div></div>`]:[])];
  b.innerHTML=`<div class="card"><div class="row"><h3 style="margin:0;color:var(--gold2)">ملخص: ${esc(c.title||l.title)}</h3><span class="sp"></span><button class="btn sm noprint" id="sp">🖨 طباعة</button>${teacher?'<button class="btn sm noprint" id="se">تعديل ملخص الفصل</button>':''}</div>
   <div class="cards" style="margin-top:10px">${cards.join('')||'<div class="empty">لا يوجد ملخص لهذا الفصل بعد.</div>'}</div></div>`;
  $('#sp',b).onclick=()=>window.print();
  if(teacher&&c.id)$('#se',b).onclick=()=>editChapter(sub.id,c.id);
}
function lessonQuiz(b,sub,l,c,q){
  const lq=q.all.filter(x=>x.lid===l.id),cq=q.all.filter(x=>x.cid===l.cid);
  b.innerHTML=`<div class="card"><h3 style="margin-top:0;color:var(--tq2)">اختبار تفاعلي بتغذية راجعة فورية</h3>
   <div class="row" style="margin:8px 0">${lq.length?`<label class="chip" style="cursor:pointer"><input type="radio" name="sc" value="l" checked> هذا الدرس (${lq.length} سؤالاً)</label>`:''}
    <label class="chip" style="cursor:pointer"><input type="radio" name="sc" value="c" ${lq.length?'':'checked'}> الفصل كله (${cq.length} سؤالاً)</label></div>
   ${!lq.length?'<p class="muted" style="margin:4px 0">لا أسئلة خاصة بهذا الدرس، فيُختبر الطالب في أسئلة فصله.</p>':''}
   <div class="row"><input type="number" id="qn" min="1" value="10" style="max-width:110px" disabled><label class="chip" style="cursor:pointer"><input type="checkbox" id="qa" checked> كل الأسئلة (بلا حدّ)</label><span class="sp"></span><button class="btn pri" id="qgo" ${cq.length?'':'disabled'}>ابدأ الاختبار</button></div></div>`;
  $('#qa',b).onchange=e=>{$('#qn',b).disabled=e.target.checked};
  $('#qgo',b).onclick=()=>{const sc=($('input[name=sc]:checked',b)||{}).value;startExam(sub.id,sc==='l'?lq:cq,$('#qa',b).checked?Infinity:Math.max(1,+$('#qn',b).value||10))};
}
function lessonBank(b,sub,l,c,q){
  if(!teacher){b.innerHTML='';return}
  const list=q.all.filter(x=>x.lid===l.id||(x.cid===l.cid&&!x.lid));
  b.innerHTML=`<div class="card"><div class="row"><h3 style="margin:0;color:var(--gold2)">🔑 بنك الأسئلة (للمدرس فقط) — ${list.length} سؤالاً</h3><span class="sp"></span><button class="btn pri" id="qa_">+ سؤال لهذا الدرس</button></div>
   <p class="muted" style="margin:6px 0 0">الإجابات الصحيحة ظاهرة هنا لأنك في وضع المدرس.</p></div>
   ${list.slice(0,200).map(x=>`<div class="card" style="padding:12px"><div class="row"><span class="chip g">${TYPES[x.type]}</span><span class="chip ${x.auto?'t':''}">${x.auto?'تلقائي':'يدوي'}</span>${x.rev?'<span class="chip revc" title="يحتاج مراجعة المدرس">⚠ للمراجعة</span>':''}${x.lid===l.id?'':'<span class="chip">على مستوى الفصل</span>'}<span class="sp"></span>${x.auto?'':`<button class="btn sm" data-eq="${x.id}">تعديل</button><button class="btn sm dng" data-dq="${x.id}">حذف</button>`}</div>
    <div style="margin-top:6px;line-height:1.8">${x.type==='read'?esc((x.passage||'').slice(0,140))+'…':rich(x.q,x.kind)}${x.fig?'<div class="fig" style="max-width:320px">'+x.fig+'</div>':''}</div>
    ${x.type==='read'?'':`<div style="margin-top:4px;color:var(--ok);font-weight:700">الإجابة: ${esc(ansOf(x))}</div>`}</div>`).join('')||'<div class="card"><div class="empty">لا توجد أسئلة بعد.</div></div>'}`;
  $('#qa_',b).onclick=()=>editQuestion(null,{sid:sub.id,cid:l.cid,lid:l.id});
  $$('[data-eq]',b).forEach(x=>x.onclick=()=>editQuestion(x.dataset.eq));
  $$('[data-dq]',b).forEach(x=>x.onclick=async()=>{if(await ask('حذف هذا السؤال؟')){const before=bankSize();S.manual=S.manual.filter(m=>m.id!==x.dataset.dq);afterChange(before,'حُذف السؤال')}});
}

/* =====================================================================
   11) التبويبات والتحديث الفوري
   ===================================================================== */
function tabsList(){const t=[['lib','المواد والدروس',viewLibrary],['exam','اختبار شامل',viewExam],['sum','الملخصات',viewSummaries],['scores','النتائج',viewScores]];
  if(teacher)t.push(['cms','إدارة المحتوى',viewCMS],['bank','بنك الأسئلة',viewBank]);return t}
let tab='lib';
function render(){
  if(!tabsList().some(t=>t[0]===tab))tab='lib';
  $('#tabs').innerHTML=tabsList().map(([k,n])=>`<button class="tab" role="tab" aria-selected="${k===tab}" data-t="${k}">${n}${k==='bank'?` <span class="chip t">${bankSize()}</span>`:''}</button>`).join('');
  $$('.tab').forEach(b=>b.onclick=()=>{if(tab==='exam'&&exam&&exam.running&&b.dataset.t!=='exam'){}tab=b.dataset.t;try{location.hash=tab}catch(e){}render()});
  const v=$('#view'),f=tabsList().find(t=>t[0]===tab)[2];f(v);
}
/* تحديث فوري عند التعديل من تبويب/نافذة أخرى */
window.addEventListener('storage',e=>{if(e.key===LS){S=loadState();if(!(exam&&exam.running)){render();toast('تم تحديث المحتوى وبنك الأسئلة تلقائياً')}}});
const h=(location.hash||'').replace('#','');if(h!=='cms'&&h!=='bank'&&tabsList().some(t=>t[0]===h))tab=h;
paintTeacher();
render();
$('#fabb').onclick=()=>{toast('في نافذة الطباعة اختر «حفظ بصيغة PDF» لحفظ الصفحة ملفاً');setTimeout(()=>window.print(),350)};
window.studio={get state(){return S},bank,fmt,canon};
</script>
